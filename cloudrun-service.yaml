apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: petwash-api
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: 2Gi
            cpu: "2"
        env:
        - name: NODE_ENV
          value: production
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: latest
              name: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: JWT_SECRET
        - name: COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: COOKIE_SECRET
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: GOOGLE_API_KEY
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: SENDGRID_API_KEY
        - name: FIREBASE_SERVICE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: FIREBASE_SERVICE_ACCOUNT_KEY
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              key: latest
              name: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: latest
              name: TWILIO_AUTH_TOKEN
        - name: TWILIO_PHONE_NUMBER
          valueFrom:
            secretKeyRef:
              key: latest
              name: TWILIO_PHONE_NUMBER
        # ── K9000 IoT machine control ───────────────────────────────────────────
        - name: MACHINE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: MACHINE_SECRET_KEY
        - name: MACHINE_ACTIVATION_URL
          valueFrom:
            secretKeyRef:
              key: latest
              name: MACHINE_ACTIVATION_URL
        # ── Prestige Pass / wallet tokens ──────────────────────────────────────
        - name: PRESTIGE_QR_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: PRESTIGE_QR_SECRET
        - name: PASS_LINK_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: PASS_LINK_SECRET
        - name: WALLET_LINK_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: WALLET_LINK_SECRET
        - name: SENDGRID_TEMPLATE_ID_MEMBER_PASS
          valueFrom:
            secretKeyRef:
              key: latest
              name: SENDGRID_TEMPLATE_ID_MEMBER_PASS
        # ── Nayax payment gateway ───────────────────────────────────────────────
        - name: NAYAX_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: NAYAX_API_KEY
        - name: NAYAX_MERCHANT_ID
          valueFrom:
            secretKeyRef:
              key: latest
              name: NAYAX_MERCHANT_ID
        - name: NAYAX_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: NAYAX_SECRET
        - name: NAYAX_TERMINAL_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: NAYAX_TERMINAL_SECRET
        # ── Provider KYC / document security ───────────────────────────────────
        - name: DOCUMENT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: DOCUMENT_ENCRYPTION_KEY
        - name: KYC_SALT
          valueFrom:
            secretKeyRef:
              key: latest
              name: KYC_SALT
        # ── Mobile auth ─────────────────────────────────────────────────────────
        - name: MOBILE_LINK_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: MOBILE_LINK_SECRET
        # ── Firebase client config (server-side injection into SPA HTML) ────────
        # FIREBASE_WEB_API_KEY is the browser-facing API key (not the service account).
        # It is synced from the VITE_FIREBASE_API_KEY GitHub secret to GCP Secret Manager
        # by the CI pipeline. The server injects it into index.html at serve-time so that
        # Firebase Auth works even when the static build was compiled without VITE_ vars.
        - name: FIREBASE_WEB_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: FIREBASE_WEB_API_KEY
        - name: FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              key: latest
              name: FIREBASE_PROJECT_ID
        # ── Super-admin access list ─────────────────────────────────────────────
        # Comma-separated emails that bypass role-based access control.
        # Must include nir.h@petwash.co.il and any other owners / operators.
        - name: SUPER_ADMIN_EMAILS
          valueFrom:
            secretKeyRef:
              key: latest
              name: SUPER_ADMIN_EMAILS
        # ── JWT token refresh ───────────────────────────────────────────────────
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: JWT_REFRESH_SECRET
        # ── Session signing ─────────────────────────────────────────────────────
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: SESSION_SECRET
        # ── reCAPTCHA Enterprise ────────────────────────────────────────────────
        - name: RECAPTCHA_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: RECAPTCHA_SECRET_KEY
        - name: RECAPTCHA_SITE_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: RECAPTCHA_SITE_KEY
        # ── Google Maps / Places API ────────────────────────────────────────────
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: GOOGLE_MAPS_API_KEY
        # ── Feature flag: enable Google Places autocomplete in production ─────
        # Required by server/lib/feature-flags/googlePlaces.ts +
        # server/routes/google-services.ts:343 (requireGooglePlacesEnabled).
        # Without this flag, /api/google/places-autocomplete returns 503
        # PLACES_DISABLED and address autocomplete is dead on the live site.
        - name: GOOGLE_PLACES_LIVE
          value: 'true'
        # ── Shop browse-only soft opening (CEO 2026-06-11) ────────────────────
        # Catalog/cart public; POST /api/shop/checkout hard-blocked with 503
        # CHECKOUT_NOT_OPEN until SHOP_CHECKOUT_ENABLED='true'. Flip together
        # with VITE_SHOP_CHECKOUT_ENABLED in petwash-ci.yml at commerce launch.
        - name: SHOP_ENABLED
          value: 'true'
        - name: SHOP_CHECKOUT_ENABLED
          value: 'false'
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          timeoutSeconds: 1
          periodSeconds: 60
          failureThreshold: 5
  traffic:
  - percent: 100
    latestRevision: true
