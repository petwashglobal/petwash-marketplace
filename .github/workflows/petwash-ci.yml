          if [ -n "$MAPS_KEY" ]; then
            printf '%s' "$MAPS_KEY" | gcloud secrets versions add "GOOGLE_MAPS_API_KEY" \
              --project="$PROJECT" \
              --data-file=- \
              --quiet 2>/dev/null || \
            printf '%s' "$MAPS_KEY" | gcloud secrets create "GOOGLE_MAPS_API_KEY" \
              --project="$PROJECT" \
              --replication-policy=automatic \
