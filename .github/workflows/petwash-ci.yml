name: PetWash CI 2026 - Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: signinpetwash
  REGION: me-west1
  SERVICE_NAME: petwash-api
  REPO_NAME: petwash-api

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          flags: |
            --cpu-boost
            --memory=2Gi
            --timeout=600
            --allow-unauthenticated
            --port=8080
            --execution-environment=gen2
            --set-env-vars=NODE_ENV=production
          secrets: |
            BASE_URL=BASE_URL:latest
            FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest
            GOOGLE_DIALOGFLOW_PROJECT_ID=GOOGLE_DIALOGFLOW_PROJECT_ID:latest
            WEBAUTHN_RP_ID=WEBAUTHN_RP_ID:latest
            SENTRY_ENV=SENTRY_ENV:latest
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest
            COOKIE_SECRET=COOKIE_SECRET:latest
            SESSION_SECRET=SESSION_SECRET:latest
            SENDGRID_API_KEY=SENDGRID_API_KEY:latest
            FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest
            TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest
            TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest
            TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest
            GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest
            GOOGLE_APPLICATION_CREDENTIALS_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest
            GOOGLE_TRANSLATE_API_KEY=GOOGLE_TRANSLATE_API_KEY:latest
            GOOGLE_WEATHER_API_KEY=GOOGLE_WEATHER_API_KEY:latest
            GOOGLE_AGENT_ID=GOOGLE_AGENT_ID:latest
            GOOGLE_AGENT_LOCATION=GOOGLE_AGENT_LOCATION:latest
            GOOGLE_BUSINESS_CLIENT_ID=GOOGLE_BUSINESS_CLIENT_ID:latest
            GOOGLE_BUSINESS_CLIENT_SECRET=GOOGLE_BUSINESS_CLIENT_SECRET:latest
            GOOGLE_BUSINESS_REFRESH_TOKEN=GOOGLE_BUSINESS_REFRESH_TOKEN:latest
            GOOGLE_BUSINESS_ACCOUNT_ID=GOOGLE_BUSINESS_ACCOUNT_ID:latest
            MOBILE_LINK_SECRET=MOBILE_LINK_SECRET:latest
            WALLET_LINK_SECRET=WALLET_LINK_SECRET:latest
            BIOMETRIC_BUCKET_NAME=BIOMETRIC_BUCKET_NAME:latest
            BIOMETRIC_PREFIX=BIOMETRIC_PREFIX:latest
            WEBAUTHN_COOKIE_SECRET=WEBAUTHN_COOKIE_SECRET:latest
            NAYAX_WEBHOOK_SECRET=NAYAX_WEBHOOK_SECRET:latest
            VOUCHER_SALT=VOUCHER_SALT:latest
            VOUCHER_ES256_PRIVATE_KEY_PEM=VOUCHER_ES256_PRIVATE_KEY_PEM:latest
            VOUCHER_ES256_PUBLIC_KEY_PEM=VOUCHER_ES256_PUBLIC_KEY_PEM:latest
            RECAPTCHA_SECRET_KEY=RECAPTCHA_SECRET_KEY:latest
            KYC_SALT=KYC_SALT:latest
            GMAIL_TOKEN_ENCRYPTION_KEY=GMAIL_TOKEN_ENCRYPTION_KEY:latest
            HUBSPOT_FORM_GUID=HUBSPOT_FORM_GUID:latest
            HUBSPOT_PORTAL_ID=HUBSPOT_PORTAL_ID:latest
            SENTRY_DSN=SENTRY_DSN:latest
            METRICS_AUTH_TOKEN=METRICS_AUTH_TOKEN:latest
            ALERTS_SLACK_WEBHOOK=ALERTS_SLACK_WEBHOOK:latest
            CS_BACKUP_BUCKET=CS_BACKUP_BUCKET:latest
            GCS_BACKUP_BUCKET=GCS_BACKUP_BUCKET:latest
            GCS_CODE_BUCKET=GCS_CODE_BUCKET:latest
            GCS_FIRESTORE_BUCKET=GCS_FIRESTORE_BUCKET:latest

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}
          VITE_API_URL: https://petwash-api-signinpetwash.me-west1.run.app

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (main + www redirect)
        run: firebase deploy --only hosting --project signinpetwash --non-interactive
