name: PetWash 2025 CI

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: 🛡️ Master Protection System
        run: npx tsx scripts/guards/master-protection-orchestrator.ts

      - name: 🚨 PREFLIGHT GUARDIAN - Block Parallel UI Systems
        run: npm run preflight

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud (2025 Method)
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          create_credentials_file: true

      - name: Install Firebase CLI
        if: github.ref == 'refs/heads/main'
        run: npm install -g firebase-tools@latest

      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main'
        run: firebase deploy --only hosting --project nifty-quanta-475212-v3
