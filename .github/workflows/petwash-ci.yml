name: PetWash CI 2026 — Production Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Apply pending SQL migrations against the prod DB (use sparingly — only after merging a PR that adds a migration)'
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: signinpetwash
  REGION: me-west1
  SERVICE_NAME: petwash-api
  IMAGE: me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend
  # Opt into Node.js 24 runner for all actions ahead of June 2026 forced migration
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Workflow self-lint: blocks merge of PRs that re-introduce the specific
  # YAML/shell traps that have caused production-deploy breaks in this repo.
  # Cheap (no auth, no build), runs on every push, fails in <10s.
  #
  # If you find yourself wanting to silence one of these checks, instead
  # fix the workflow file — the checks exist because each pattern caused
  # real broken deploys (PR #448 = apostrophes in flags-block comments,
  # 2026-05-25).
  # ─────────────────────────────────────────────────────────────────────────
  gate-workflow-self-lint:
    name: Gate — workflow self-lint (deploy traps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: "Detect hash-comments inside flags blocks"
        run: |
          python3 - <<'PY'
          import sys, yaml

          # YAML literal block scalars (`flags: |`) preserve every line as
          # part of the string value, INCLUDING lines that start with `#`.
          # google-github-actions/deploy-cloudrun then forwards each line to
          # the shell invocation of gcloud as a positional arg. Apostrophes
          # or single-quote characters inside those comments are interpreted
          # as unterminated shell quotes and abort the deploy with:
          #
          #   Error: unterminated single quote in --cpu=2 ... # ... today's ...
          #
          # PR #448 (2026-05-25) shipped exactly this pattern and broke
          # production deploys. This check catches the regression.

          with open('.github/workflows/petwash-ci.yml') as f:
              wf = yaml.safe_load(f)

          offenders = []
          def walk(node, path=''):
              if isinstance(node, dict):
                  for k, v in node.items():
                      sub = f'{path}.{k}' if path else k
                      if k == 'flags' and isinstance(v, str):
                          for n, raw in enumerate(v.splitlines(), 1):
                              if raw.lstrip().startswith('#'):
                                  offenders.append((sub, n, raw.strip()))
                      else:
                          walk(v, sub)
              elif isinstance(node, list):
                  for i, item in enumerate(node):
                      walk(item, f'{path}[{i}]')
          walk(wf)

          if offenders:
              print('::error::Inline # comments found inside `flags: |` block(s).')
              print('These are passed to the shell as positional args and break gcloud')
              print('parsing on apostrophes or single quotes (real outage: PR #448).')
              print('')
              print('Fix: move the explanation OUT of the `flags: |` block.')
              print('Put it as a real YAML comment above the step instead.')
              print('')
              for path, ln, line in offenders:
                  print(f'  • {path} line {ln}: {line}')
              sys.exit(1)

          print('✅ No # comments inside any `flags: |` block.')
          PY

      - name: "Detect apostrophes inside flags blocks"
        run: |
          python3 - <<'PY'
          import sys, yaml
          with open('.github/workflows/petwash-ci.yml') as f:
              wf = yaml.safe_load(f)

          offenders = []
          def walk(node, path=''):
              if isinstance(node, dict):
                  for k, v in node.items():
                      sub = f'{path}.{k}' if path else k
                      if k == 'flags' and isinstance(v, str):
                          for n, raw in enumerate(v.splitlines(), 1):
                              if "'" in raw:
                                  offenders.append((sub, n, raw.strip()))
                      else:
                          walk(v, sub)
              elif isinstance(node, list):
                  for i, item in enumerate(node):
                      walk(item, f'{path}[{i}]')
          walk(wf)

          if offenders:
              print('::error::Single-quote characters found in `flags: |` block(s).')
              print('These break gcloud shell parsing with "unterminated single quote".')
              print('Use double quotes or rephrase to avoid apostrophes inside flags.')
              for path, ln, line in offenders:
                  print(f'  • {path} line {ln}: {line}')
              sys.exit(1)

          print('✅ No apostrophes in any `flags: |` block.')
          PY


  # ════════════════════════════════════════════════════════════════════════
  # PR-STARTUP-HARDEN-1 — Pre-deploy gates
  # These two jobs run BEFORE deploy-backend. The deploy job has `needs: [...]`
  # on both, so a failing smoke test or stale env-var audit blocks production.
  # No app code runs in these jobs — they are pure CI scaffolding.
  # ════════════════════════════════════════════════════════════════════════
  gate-smoke-test-startup:
    name: Gate — routes.ts module-load smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run routes-load smoke test
        env:
          # Production-shaped env (DUMMY values — never real secrets).
          # If a production env var is required at module load and not in this
          # list, this test will surface it and the gate fails closed.
          # ALL VALUES BELOW ARE SMOKE-TEST DUMMIES — NEVER REAL CREDENTIALS.
          # Every value here is clearly labeled "smoke-dummy-..." so a future
          # reader cannot mistake them for production keys. Production secrets
          # live in GCP Secret Manager and are mapped by deploy-backend below,
          # not by this gate job. Auto-detected required env vars are listed
          # in docs/PRODUCTION_REQUIRED_ENV_VARS.md — the audit gate (sibling
          # job) keeps that file in sync with the source tree.
          NODE_ENV: production
          NAYAX_ENABLED: 'false'
          PAYMENT_PROVIDER_MODE: mock
          # Module-load REQUIRED (per audit ⚠️ MODULE_LOAD tag) — server fails
          # to import server/routes.ts without these. Verified locally.
          SENDGRID_FROM_EMAIL: noreply@petwash.invalid
          # STATION_KEYS removed 2026-05-24: K9000 stations are inactive.
          # server/nayaxFirestoreService.ts now defaults the map to {} when
          # the env var is absent and validateStationKey() fails closed via
          # Firestore lookup, so the build smoke test no longer needs a
          # dummy value to satisfy a module-load throw.
          # Function-body REQUIRED (REQUIRED but not MODULE_LOAD) — these throw
          # only when the specific feature is exercised at runtime. Setting
          # them here keeps the smoke test aligned with production env shape.
          WALLET_LINK_SECRET: smoke-dummy-walletlinksecret-do-not-use
          PRESTIGE_QR_SECRET: smoke-dummy-prestige-do-not-use-this-value-anywhere
          PASS_LINK_SECRET: smoke-dummy-passlink-do-not-use
          JWT_SECRET: smoke-dummy-jwt-secret-do-not-use
          JWT_REFRESH_SECRET: smoke-dummy-jwt-refresh-secret-do-not-use
          COOKIE_SECRET: smoke-dummy-cookie-secret-do-not-use
          IP_HASH_SALT: smoke-dummy-ip-hash-salt
          KYC_SALT: smoke-dummy-kyc-salt
          # Encryption-key dummies — note "smoke-dummy-" comment label for clarity.
          # The hex format is required by the consuming code; the value is fake.
          TREASURY_FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef  # smoke-dummy-treasury-key
          DOCUMENT_ENCRYPTION_KEY:       0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef  # smoke-dummy-document-key
          MACHINE_SECRET_KEY: smoke-dummy-machine-secret
          # Misc REQUIRED / commonly-read vars
          ADMIN_NOTIFICATION_EMAIL: smoke@petwash.invalid
          DATABASE_URL: postgresql://x:x@localhost/x
          SMOKE_TIMEOUT_MS: '90000'
          SMOKE_BOOT_THRESHOLD_MS: '60000'
        run: npx tsx scripts/smoke-test-routes-load.ts

      - name: Upload smoke-test artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: smoke-test-output/
          retention-days: 14
          if-no-files-found: warn

  gate-audit-env-vars:
    # 2026-style fix v2: pure-advisory, never-blocking, never-pushing.
    #
    # History:
    #   v0  ran `--check` and failed the deploy on drift.  Pre-fix this
    #       blocked PR #429 (Maya) and PR #432 (deploy-startup-probe).
    #       Robot work for humans.
    #   v1  tried to auto-commit the regenerated doc back to main as
    #       github-actions[bot] with [skip ci].  Repository ruleset
    #       requires PRs for ALL changes to main, even bot pushes →
    #       remote rejected with GH013 → deploy still blocked.
    #   v2  (this) — drop the push entirely. The job regenerates the
    #       doc, logs the drift as a GitHub Actions ::notice, and
    #       always exits 0. Deploy is NEVER blocked.
    #
    # Cost of v2: the committed doc may temporarily fall behind the
    # actual code. That's fine — the doc is documentation, not the
    # source of truth. The source of truth is the `process.env.*`
    # reads in the code itself.
    #
    # Cure for stale doc: whenever someone wants to refresh it,
    # they include the regenerator's output in a normal PR:
    #     npx tsx scripts/audit-required-env-vars.ts
    #     git add docs/PRODUCTION_REQUIRED_ENV_VARS.md
    #     git commit -m "chore(env-audit): resync"
    # That PR goes through normal review like everything else.
    name: env-audit doc (advisory, never blocks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Regenerate (in-memory) and report drift
        run: |
          npx tsx scripts/audit-required-env-vars.ts
          if git diff --quiet docs/PRODUCTION_REQUIRED_ENV_VARS.md; then
            echo "✅ env-audit doc is in sync"
          else
            echo "ℹ️  env-audit doc has drifted (advisory — does NOT block deploy)"
            echo "    To refresh on the next PR run:"
            echo "       npx tsx scripts/audit-required-env-vars.ts"
            echo "       git add docs/PRODUCTION_REQUIRED_ENV_VARS.md"
            echo "       git commit -m 'chore(env-audit): resync'"
            echo ""
            echo "Drift summary:"
            git --no-pager diff --stat docs/PRODUCTION_REQUIRED_ENV_VARS.md
            echo ""
            echo "::notice title=env-audit drift::The env-audit doc has drifted. Advisory only; deploy continues. Run the regenerator in your next PR to refresh."
          fi
          # Always exit clean. NEVER block the deploy on this.
          exit 0

  # ════════════════════════════════════════════════════════════════════════
  # Apply pending SQL migrations BEFORE the new Cloud Run revision takes
  # traffic. Without this step, a PR that adds a migration ships the code
  # but leaves the DB schema behind — first write to the new table crashes
  # the route (real exposure on PR #392 + #393 + #394).
  #
  # Why a custom script instead of `drizzle-kit migrate`:
  #   migrations/_journal.json tracks only 6 of 28+ SQL files. drizzle-kit
  #   migrate would skip the 22 hand-written ones. The custom runner in
  #   scripts/apply-pending-migrations.ts uses its own _petwash_migrations
  #   tracking table, is bootstrap-safe (existing tables hit "already
  #   exists" → recorded as applied without re-running), and fails closed
  #   on any real error.
  #
  # Connection: DATABASE_URL is mounted directly from Secret Manager. The
  # production DB is Neon (per server/db.ts using @neondatabase/serverless);
  # connecting from the GitHub runner is a normal HTTPS/WSS call — no
  # Cloud SQL Auth Proxy needed. If the deploy ever migrates to Cloud SQL,
  # add `--add-cloudsql-instances` to the deploy step and switch this
  # step to use cloud-sql-proxy.
  #
  # Safety: concurrency: production-deploy at workflow level serializes
  # runs. deploy-backend.needs includes apply-migrations so a migration
  # failure blocks the deploy.
  # ════════════════════════════════════════════════════════════════════════
  apply-migrations:
    name: Apply pending SQL migrations
    runs-on: ubuntu-latest
    needs: [gate-smoke-test-startup, gate-audit-env-vars]
    # M-DEPLOY-2: opt-in via workflow_dispatch ONLY. Not on push.
    #
    # History: PR #395 shipped this as a deploy gate. #402 added a manual
    # allowlist, #403 added lenient mode, #404 added continue-on-error +
    # non-tx detection. Each PR fixed a real edge case the previous
    # build surfaced. CI #970 still failed because the @neondatabase/
    # serverless WebSocket driver wraps multi-statement queries in an
    # implicit transaction (even when our code skips BEGIN/COMMIT), and
    # the catch-up is endless.
    #
    # Honest root cause: the codebase's actual schema source-of-truth is
    # shared/schema.ts synced via out-of-band `drizzle-kit push`, NOT
    # the migrations/*.sql files. Auto-walking files against a divergent
    # prod will keep finding edge cases forever. PR #395 was a wrong
    # call — built on the assumption that migration files were the
    # source of truth. They aren't.
    #
    # New contract:
    #   - This job ONLY runs when an operator explicitly triggers it via
    #     `gh workflow run petwash-ci.yml -f run_migrations=true` (or
    #     the equivalent "Run workflow" button in the GitHub Actions UI
    #     with the checkbox enabled).
    #   - Operators trigger it after merging a PR that adds a real new
    #     migration (e.g. slot-locks, nayax dedup, maya tables) — never
    #     on every push.
    #   - Auto-push to main NO LONGER runs this. Pipeline noise gone.
    #   - The script keeps --lenient mode + the .manual-migrations.txt
    #     allowlist + the (now correctly-implemented) split-statement
    #     non-tx handling so when operators DO invoke it, it works.
    #
    # To re-enable auto-runs in the future, two things must be true:
    #   (1) shared/schema.ts and migrations/*.sql are reconciled into a
    #       single source of truth (no drizzle-kit push usage)
    #   (2) _journal.json tracks every file (no hand-written migrations
    #       outside the journal)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations == true }}
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: signinpetwash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch DATABASE_URL from Secret Manager
        id: fetch-db-url
        run: |
          set -e
          if ! gcloud secrets describe "DATABASE_URL" --project="$PROJECT_ID" --quiet &>/dev/null; then
            echo "::error::DATABASE_URL secret missing from Secret Manager. Migration cannot run."
            exit 1
          fi
          DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL --project="$PROJECT_ID")
          # Mask the value in all subsequent log output.
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Apply pending SQL migrations
        run: |
          set -e
          echo "Applying pending SQL migrations to production database..."
          # Uses scripts/apply-pending-migrations.ts — bootstrap-safe + idempotent.
          # See that file's header docstring for full semantics.
          #
          # --lenient: tolerate UNDEFINED_REFERENCE_CODES (42P01 / 42703)
          # because prod schema drifted from migration files — some tables
          # exist via out-of-band `drizzle-kit push` against shared/schema.ts
          # rather than a CREATE TABLE migration. Without --lenient one
          # orphaned ALTER (e.g. 0015 on station_settlements) blocks every
          # downstream migration from applying — including the NEW ones we
          # actually need (slot-locks, nayax dedup, etc.). Lenient mode
          # logs orphans as ORPHANED, continues to the next file, and
          # prints an end-of-run summary so operators see what didn't run.
          # Local dev invocations stay STRICT (without the flag).
          npx tsx scripts/apply-pending-migrations.ts --lenient
          echo "✅ Migrations step finished."

  deploy-backend:
    name: Build & Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    # M-DEPLOY-2: apply-migrations removed from needs[]. That job is now
    # workflow_dispatch-only — on a normal push it never runs, so listing
    # it in needs[] would skip deploy-backend forever. The two pre-deploy
    # gates (routes-load smoke + env-var audit) remain required.
    needs: [gate-smoke-test-startup, gate-audit-env-vars, gate-workflow-self-lint]
    permissions:
      contents: read
      id-token: write

    outputs:
      cloud_run_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure required GCP secrets exist (base + generated)
        env:
          # Passed via env to handle JSON with embedded double-quotes and newlines safely.
          SA_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          PROJECT="$PROJECT_ID"

          ensure_secret() {
            local NAME=$1
            local VALUE=$2
            if ! gcloud secrets describe "$NAME" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
              echo "⚠️  Creating missing GCP secret: $NAME"
              printf '%s' "$VALUE" | gcloud secrets create "$NAME" \
                --project="$PROJECT" \
                --replication-policy=automatic \
                --data-file=- \
                --quiet
              echo "✅ Created: $NAME"
            else
              echo "✅ Exists:  $NAME"
            fi
          }

          # PRESTIGE_QR_SECRET — QR token signing key for Prestige Pass (45-second kiosk QR)
          ensure_secret "PRESTIGE_QR_SECRET" "$(openssl rand -hex 32)"

          # PASS_LINK_SECRET — distinct 72-hour wallet-email link signing key
          # Must be different from PRESTIGE_QR_SECRET; auto-generated if not yet present.
          ensure_secret "PASS_LINK_SECRET" "$(openssl rand -hex 32)"

          # DOCUMENT_ENCRYPTION_KEY — AES-256-GCM master key for provider KYC / biometric docs
          # Auto-generated on first deploy; value is stable once created (rotation requires key migration).
          ensure_secret "DOCUMENT_ENCRYPTION_KEY" "$(openssl rand -hex 32)"

          # MACHINE_SECRET_KEY — shared HMAC secret between Cloud Run and K9000 IoT controllers.
          # TEMPORARY: K9000 stations are in storage and not yet installed.
          # Deploy continues with a placeholder; K9000 hardware activation remains DISABLED until
          # real machines are commissioned and this secret is replaced with the hardware value.
          # When ready: gcloud secrets versions add MACHINE_SECRET_KEY --data-file=-
          if ! gcloud secrets describe "MACHINE_SECRET_KEY" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "⚠️  WARNING: MACHINE_SECRET_KEY not found in GCP Secret Manager."
            echo "   K9000 stations are not yet installed — creating placeholder. Hardware activation will be DISABLED."
            printf '%s' "$(openssl rand -hex 32)" | gcloud secrets create "MACHINE_SECRET_KEY" \
              --project="$PROJECT" \
              --replication-policy=automatic \
              --data-file=- \
              --quiet
            echo "⚠️  MACHINE_SECRET_KEY: placeholder created. Replace with real K9000 HMAC key before commissioning machines."
          else
            echo "✅ Exists:  MACHINE_SECRET_KEY"
          fi

          # MACHINE_ACTIVATION_URL — HTTP endpoint of K9000 IoT controller (e.g. http://10.x.x.x/api/start).
          # TEMPORARY: K9000 stations are in storage and not yet installed.
          # Deploy continues with a placeholder; K9000 hardware activation remains DISABLED until
          # real machines are installed and this secret is replaced with the live controller URL.
          # When ready: gcloud secrets versions add MACHINE_ACTIVATION_URL --data-file=-
          if ! gcloud secrets describe "MACHINE_ACTIVATION_URL" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "⚠️  WARNING: MACHINE_ACTIVATION_URL not found in GCP Secret Manager."
            echo "   K9000 stations are not yet installed — creating placeholder. Hardware activation will be DISABLED."
            printf '%s' "http://127.0.0.1:0/k9000-disabled" | gcloud secrets create "MACHINE_ACTIVATION_URL" \
              --project="$PROJECT" \
              --replication-policy=automatic \
              --data-file=- \
              --quiet
            echo "⚠️  MACHINE_ACTIVATION_URL: placeholder created. Replace with real K9000 controller URL before commissioning machines."
          else
            echo "✅ Exists:  MACHINE_ACTIVATION_URL"
          fi

          # NAYAX_API_KEY / NAYAX_MERCHANT_ID / NAYAX_SECRET / NAYAX_TERMINAL_SECRET
          # OPTIONAL: Live Nayax credentials are not yet provisioned.
          # Deploy continues with inert placeholders; online payment flows will be disabled
          # until real Nayax-issued values replace these secrets.
          # TO ACTIVATE: printf '%s' "<real-value>" | gcloud secrets versions add <NAME> --data-file=-
          for NAYAX_VAR in NAYAX_API_KEY NAYAX_MERCHANT_ID NAYAX_SECRET NAYAX_TERMINAL_SECRET; do
            if ! gcloud secrets describe "$NAYAX_VAR" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
              echo "⚠️  WARNING: $NAYAX_VAR not found — Nayax live credentials not yet provisioned."
              echo "   Creating placeholder. Online Nayax payments will be DISABLED until real credential is set."
              printf '%s' "nayax-placeholder-not-active" | gcloud secrets create "$NAYAX_VAR" \
                --data-file=- \
                --project="$PROJECT" \
                --quiet
            fi
          done

          # SENDGRID_TEMPLATE_ID_MEMBER_PASS — SendGrid dynamic template ID for pass delivery emails.
          # Auto-creates a placeholder; replace with the real template ID from the SendGrid dashboard.
          ensure_secret "SENDGRID_TEMPLATE_ID_MEMBER_PASS" "d-PLACEHOLDER_SET_REAL_TEMPLATE_ID"

          # Warn loudly if the SendGrid template is still a placeholder so deploys don't silently ship broken pass emails.
          TMPL_VAL=$(gcloud secrets versions access latest --secret="SENDGRID_TEMPLATE_ID_MEMBER_PASS" --project="$PROJECT" 2>/dev/null || true)
          if [ "$TMPL_VAL" = "d-PLACEHOLDER_SET_REAL_TEMPLATE_ID" ]; then
            echo "⚠️  WARNING: SENDGRID_TEMPLATE_ID_MEMBER_PASS is still a placeholder."
            echo "   Prestige Pass delivery emails will receive a SendGrid 400 error until this is set."
            echo "   Update with: gcloud secrets versions add SENDGRID_TEMPLATE_ID_MEMBER_PASS --data-file=- <<< 'd-yourRealTemplateId'"
          fi

          # RECAPTCHA_SITE_KEY — reCAPTCHA Enterprise site key (server-side)
          ensure_secret "RECAPTCHA_SITE_KEY" "6LfPr3ksAAAAAAk-gDoRZk6T3bA_t9UNavopPTDJ"

          # ACCOUNTING_SPREADSHEET_ID — BookingExportService accounting exports
          ensure_secret "ACCOUNTING_SPREADSHEET_ID" "1dGgGUwiTI0htO0SvkzPEkXDWnjiOp8PUZRI3RDk_LJk"

          # GCS bucket names — fallback values matching hardcoded defaults in server code
          ensure_secret "CONTRACTOR_DOCS_BUCKET"        "petwash-contractor-documents"
          ensure_secret "GCS_DOCUMENTS_BUCKET"          "petwash-secure-documents"
          ensure_secret "GCS_FINANCIAL_BUCKET"          "petwash-secure-documents"
          ensure_secret "GCS_LOGS_BUCKET"               "petwash-logs-retention"
          ensure_secret "GCS_MESSAGE_ATTACHMENTS_BUCKET" "petwash-message-attachments"
          ensure_secret "GCS_STAMPS_BUCKET"             "petwash-legal-stamps"
          ensure_secret "GCS_CODE_BUCKET"               "petwash-code-backups"
          ensure_secret "GCS_FIRESTORE_BUCKET"          "petwash-firestore-backups"
          ensure_secret "FIREBASE_STORAGE_BUCKET"       "signinpetwash.firebasestorage.app"

          # ── Symmetric signing / encryption keys (safe to auto-generate once) ──────────────
          # JWT_SECRET / JWT_REFRESH_SECRET — HS512 signing keys for access and refresh tokens.
          # Rotating these invalidates all active sessions — treat as stable once created.
          ensure_secret "JWT_SECRET"         "$(openssl rand -hex 64)"
          ensure_secret "JWT_REFRESH_SECRET" "$(openssl rand -hex 64)"

          # COOKIE_SECRET / SESSION_SECRET — Express cookie-parser / session signing.
          ensure_secret "COOKIE_SECRET"  "$(openssl rand -hex 32)"
          ensure_secret "SESSION_SECRET" "$(openssl rand -hex 32)"

          # WEBAUTHN_COOKIE_SECRET — separate signing key for WebAuthn challenge cookies.
          ensure_secret "WEBAUTHN_COOKIE_SECRET" "$(openssl rand -hex 32)"

          # MOBILE_LINK_SECRET / WALLET_LINK_SECRET — HMAC keys for deep-link token signing.
          ensure_secret "MOBILE_LINK_SECRET" "$(openssl rand -hex 32)"
          ensure_secret "WALLET_LINK_SECRET" "$(openssl rand -hex 32)"

          # VOUCHER_SALT — HMAC salt for voucher code derivation.
          ensure_secret "VOUCHER_SALT" "$(openssl rand -hex 32)"

          # KYC_SALT — HMAC salt for KYC identifier derivation.
          ensure_secret "KYC_SALT" "$(openssl rand -hex 32)"

          # GMAIL_TOKEN_ENCRYPTION_KEY — AES-256-GCM key for Gmail OAuth token storage.
          ensure_secret "GMAIL_TOKEN_ENCRYPTION_KEY" "$(openssl rand -hex 32)"

          # NAYAX_WEBHOOK_SECRET — HMAC secret for verifying Nayax webhook signatures.
          # Auto-generate if absent; register this value in the Nayax partner portal.
          ensure_secret "NAYAX_WEBHOOK_SECRET" "$(openssl rand -hex 32)"

          # ── EC key pair for voucher JWT signing (ES256) ──────────────────────────────────
          # Both keys are auto-generated together on first deploy.
          # Rotating the private key invalidates all outstanding voucher tokens.
          PRIV_EXISTS=false; PUB_EXISTS=false
          gcloud secrets describe "VOUCHER_ES256_PRIVATE_KEY_PEM" --project="$PROJECT" --quiet &>/dev/null 2>&1 && PRIV_EXISTS=true
          gcloud secrets describe "VOUCHER_ES256_PUBLIC_KEY_PEM"  --project="$PROJECT" --quiet &>/dev/null 2>&1 && PUB_EXISTS=true
          if [ "$PRIV_EXISTS" = "true" ] && [ "$PUB_EXISTS" = "true" ]; then
            echo "✅ Exists:  VOUCHER_ES256_PRIVATE_KEY_PEM"
            echo "✅ Exists:  VOUCHER_ES256_PUBLIC_KEY_PEM"
          elif [ "$PRIV_EXISTS" = "false" ] && [ "$PUB_EXISTS" = "false" ]; then
            echo "⚠️  Creating missing GCP secret pair: VOUCHER_ES256_PRIVATE_KEY_PEM + VOUCHER_ES256_PUBLIC_KEY_PEM"
            PRIV_KEY=$(openssl ecparam -name prime256v1 -genkey -noout 2>/tmp/openssl_priv_err | openssl pkcs8 -topk8 -nocrypt 2>>/tmp/openssl_priv_err)
            if [ -z "$PRIV_KEY" ]; then
              echo "❌ openssl failed to generate EC private key: $(cat /tmp/openssl_priv_err 2>/dev/null)" && exit 1
            fi
            PUB_KEY=$(printf '%s' "$PRIV_KEY" | openssl ec -pubout 2>/tmp/openssl_pub_err)
            if [ -z "$PUB_KEY" ]; then
              echo "❌ openssl failed to derive EC public key: $(cat /tmp/openssl_pub_err 2>/dev/null)" && exit 1
            fi
            printf '%s' "$PRIV_KEY" | gcloud secrets create "VOUCHER_ES256_PRIVATE_KEY_PEM" \
              --project="$PROJECT" --replication-policy=automatic --data-file=- --quiet
            printf '%s' "$PUB_KEY"  | gcloud secrets create "VOUCHER_ES256_PUBLIC_KEY_PEM" \
              --project="$PROJECT" --replication-policy=automatic --data-file=- --quiet
            echo "✅ Created: VOUCHER_ES256_PRIVATE_KEY_PEM + VOUCHER_ES256_PUBLIC_KEY_PEM"
          else
            echo "❌ VOUCHER_ES256 key pair is in an inconsistent state (one key exists, the other does not)."
            echo "   Delete whichever key exists and re-run, or create both manually."
            exit 1
          fi

          # ── GOOGLE_SERVICE_ACCOUNT_JSON — sync from the CI auth credential ──────────────
          # Cloud Run reads this secret as GOOGLE_APPLICATION_CREDENTIALS_JSON at runtime.
          # We reuse the same service-account JSON that authenticates this CI job.
          # SA_JSON is passed via the step env block to safely handle JSON with special chars.
          # Idempotent — sync-gcp-secret.sh skips when the latest version already matches,
          # so we don't accumulate a new version on every CI run.
          if [ -n "$SA_JSON" ]; then
            PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "GOOGLE_SERVICE_ACCOUNT_JSON" "$SA_JSON"
          elif gcloud secrets describe "GOOGLE_SERVICE_ACCOUNT_JSON" --project="$PROJECT" --quiet >/dev/null 2>&1; then
            echo "✅ Exists:  GOOGLE_SERVICE_ACCOUNT_JSON (no GitHub credential to compare)"
          else
            echo "❌ GOOGLE_SERVICE_ACCOUNT_JSON not found in GCP Secret Manager and GOOGLE_APPLICATION_CREDENTIALS_JSON GitHub secret is absent." && exit 1
          fi

          # ── Known-default config values ───────────────────────────────────────────────────
          ensure_secret "BASE_URL"           "https://petwash.co.il"
          ensure_secret "FIREBASE_PROJECT_ID" "signinpetwash"
          ensure_secret "WEBAUTHN_RP_ID"     "petwash.co.il"
          ensure_secret "BIOMETRIC_BUCKET_NAME" "petwash-biometric-data"
          ensure_secret "BIOMETRIC_PREFIX"   "biometric/"
          ensure_secret "GCS_BACKUP_BUCKET"  "petwash-backups"

          # ── Externally-supplied credentials (must be pre-created) ────────────────────────
          # DATABASE_URL — PostgreSQL connection string. Pre-create with your DB URL.
          if ! gcloud secrets describe "DATABASE_URL" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "❌ DATABASE_URL secret not found in GCP Secret Manager."
            echo "   Create it with your PostgreSQL connection string before deploying."
            exit 1
          fi

          # ── Optional integration credentials (warn-only if absent) ───────────────────────
          # GOOGLE_TRANSLATE_API_KEY — translation feature is degraded but non-fatal without it.
          if ! gcloud secrets describe "GOOGLE_TRANSLATE_API_KEY" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "⚠️  WARNING: GOOGLE_TRANSLATE_API_KEY not found — translation features will be unavailable."
            ensure_secret "GOOGLE_TRANSLATE_API_KEY" "PLACEHOLDER_SET_REAL_TRANSLATE_KEY"
          else
            echo "✅ Exists:  GOOGLE_TRANSLATE_API_KEY"
          fi

          # GOOGLE_WEATHER_API_KEY — weather feature is degraded but non-fatal without it.
          if ! gcloud secrets describe "GOOGLE_WEATHER_API_KEY" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "⚠️  WARNING: GOOGLE_WEATHER_API_KEY not found — weather features will be unavailable."
            ensure_secret "GOOGLE_WEATHER_API_KEY" "PLACEHOLDER_SET_REAL_WEATHER_KEY"
          else
            echo "✅ Exists:  GOOGLE_WEATHER_API_KEY"
          fi

          # HUBSPOT_FORM_GUID / HUBSPOT_PORTAL_ID — HubSpot CRM integration.
          if ! gcloud secrets describe "HUBSPOT_FORM_GUID" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "⚠️  WARNING: HUBSPOT_FORM_GUID not found — HubSpot form submissions will be skipped."
            ensure_secret "HUBSPOT_FORM_GUID"  "PLACEHOLDER_SET_REAL_HUBSPOT_FORM_GUID"
          else
            echo "✅ Exists:  HUBSPOT_FORM_GUID"
          fi
          if ! gcloud secrets describe "HUBSPOT_PORTAL_ID" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "⚠️  WARNING: HUBSPOT_PORTAL_ID not found — HubSpot CRM integration will be skipped."
            ensure_secret "HUBSPOT_PORTAL_ID" "PLACEHOLDER_SET_REAL_HUBSPOT_PORTAL_ID"
          else
            echo "✅ Exists:  HUBSPOT_PORTAL_ID"
          fi

          # GOOGLE_FORMS_SPREADSHEET_ID — Google Forms response export target.
          if ! gcloud secrets describe "GOOGLE_FORMS_SPREADSHEET_ID" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
            echo "⚠️  WARNING: GOOGLE_FORMS_SPREADSHEET_ID not found — Google Forms export will be skipped."
            ensure_secret "GOOGLE_FORMS_SPREADSHEET_ID" "PLACEHOLDER_SET_REAL_FORMS_SPREADSHEET_ID"
          else
            echo "✅ Exists:  GOOGLE_FORMS_SPREADSHEET_ID"
          fi

          # SUPER_ADMIN_EMAILS — checked below in its own dedicated sync step.
          # The dedicated step (after this one) syncs from the SUPER_ADMIN_EMAILS GitHub Secret
          # and fails the build if the secret is still a placeholder.

      - name: Sync SUPER_ADMIN_EMAILS from GitHub secret
        env:
          SUPER_ADMIN_EMAILS_VAL: ${{ secrets.SUPER_ADMIN_EMAILS }}
        run: |
          PROJECT="$PROJECT_ID"

          if [ -n "$SUPER_ADMIN_EMAILS_VAL" ]; then
            # GitHub Secret is present — sync it to GCP, overwriting any placeholder.
            # Idempotent — only writes a new version when the value actually changed.
            PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "SUPER_ADMIN_EMAILS" "$SUPER_ADMIN_EMAILS_VAL"
          else
            # No GitHub Secret provided — check the existing GCP value.
            if ! gcloud secrets describe "SUPER_ADMIN_EMAILS" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
              echo "❌ SUPER_ADMIN_EMAILS secret not found in GCP Secret Manager."
              echo "   Set the SUPER_ADMIN_EMAILS GitHub Actions Secret (comma-separated admin emails)"
              echo "   OR run: printf 'admin@example.com' | gcloud secrets create SUPER_ADMIN_EMAILS --project=$PROJECT --replication-policy=automatic --data-file=-"
              exit 1
            fi
            CURRENT_VAL=$(gcloud secrets versions access latest --secret="SUPER_ADMIN_EMAILS" --project="$PROJECT" --quiet 2>/dev/null || true)
            if echo "$CURRENT_VAL" | grep -qi "PLACEHOLDER"; then
              echo "❌ SUPER_ADMIN_EMAILS in GCP Secret Manager still contains placeholder text."
              echo "   Super-admin login will fail until this is updated."
              echo "   Fix option A — set the SUPER_ADMIN_EMAILS GitHub Actions Secret to a comma-separated list of admin emails and re-run this workflow."
              echo "   Fix option B — run: printf 'nir.h@petwash.co.il' | gcloud secrets versions add SUPER_ADMIN_EMAILS --project=$PROJECT --data-file=-"
              exit 1
            fi
            echo "✅ SUPER_ADMIN_EMAILS: exists in GCP Secret Manager with real value"
          fi

      - name: Sync FIREBASE_WEB_API_KEY and Firebase client config from GitHub secrets
        env:
          FIREBASE_WEB_API_KEY_VAL: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_MESSAGING_SENDER_ID_VAL: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID_VAL: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID_VAL: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          FIREBASE_PROJECT_ID_VAL: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          PROJECT="$PROJECT_ID"

          # All Firebase web-config secrets flow through the idempotent helper.
          # Helper skips writes when the GCP latest version already matches —
          # this is what stops the 330-versions/secret bloat we hit on
          # TWILIO_AUTH_TOKEN and others.
          sync_optional_secret() {
            local NAME=$1
            local VALUE=$2
            if [ -n "$VALUE" ]; then
              PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "$NAME" "$VALUE"
            else
              if gcloud secrets describe "$NAME" --project="$PROJECT" --quiet >/dev/null 2>&1; then
                echo "✅ $NAME: exists in GCP Secret Manager (no GitHub secret to sync)"
              else
                echo "⚠️  $NAME: not in GCP Secret Manager and no GitHub secret provided — server-side Firebase config injection will be partial"
              fi
            fi
          }


          if [ -n "$FIREBASE_WEB_API_KEY_VAL" ]; then
            PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "FIREBASE_WEB_API_KEY" "$FIREBASE_WEB_API_KEY_VAL"
          else
            if gcloud secrets describe "FIREBASE_WEB_API_KEY" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              echo "✅ FIREBASE_WEB_API_KEY: exists in GCP Secret Manager (no GitHub secret to sync)"
            else
              echo "❌ FIREBASE_WEB_API_KEY: not found in GCP Secret Manager and VITE_FIREBASE_API_KEY GitHub secret is absent." && exit 1
            fi
          fi

          sync_optional_secret "FIREBASE_PROJECT_ID" "$FIREBASE_PROJECT_ID_VAL"
          sync_optional_secret "FIREBASE_MESSAGING_SENDER_ID" "$FIREBASE_MESSAGING_SENDER_ID_VAL"
          sync_optional_secret "FIREBASE_APP_ID" "$FIREBASE_APP_ID_VAL"
          sync_optional_secret "FIREBASE_MEASUREMENT_ID" "$FIREBASE_MEASUREMENT_ID_VAL"


      - name: Sync GOOGLE_MAPS_API_KEY from GitHub secret
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          PROJECT="$PROJECT_ID"

          if [ -n "$MAPS_KEY" ]; then
            PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "GOOGLE_MAPS_API_KEY" "$MAPS_KEY"
          else
            if gcloud secrets describe "GOOGLE_MAPS_API_KEY" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              echo "✅ GOOGLE_MAPS_API_KEY: exists in GCP Secret Manager (no GitHub secret to sync)"
            else
              echo "❌ GOOGLE_MAPS_API_KEY: not found in GCP Secret Manager and no GitHub secret provided" && exit 1
            fi
          fi

      # PR-STARTUP-FIX-5: removed "Sync FIREBASE_SERVICE_ACCOUNT_KEY from GitHub secret"
      # step. The CEO's A2 fix (2026-05-18) was to remove the env var and rely on
      # Cloud Run Application Default Credentials. The workflow was silently
      # re-injecting a (possibly malformed) value on every deploy, causing
      # bug #9 (production loading_routes Error on every revision).
      # Firebase admin SDK uses ADC via the Cloud Run service account.
      # If you ever need to pin an explicit service account JSON again,
      # restore this step from git history at commit 723cca8 — but ensure
      # the GitHub secret FIREBASE_SERVICE_ACCOUNT contains valid JSON first,
      # and verify via the post-deploy /api/health gate.

      - name: Sync SENDGRID_API_KEY from GitHub secret
        env:
          SENDGRID_API_KEY_VAL: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          PROJECT="$PROJECT_ID"

          if [ -n "$SENDGRID_API_KEY_VAL" ]; then
            PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "SENDGRID_API_KEY" "$SENDGRID_API_KEY_VAL"
          else
            if gcloud secrets describe "SENDGRID_API_KEY" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              echo "✅ SENDGRID_API_KEY: exists in GCP Secret Manager (no GitHub secret to sync)"
            else
              echo "❌ SENDGRID_API_KEY: not found in GCP Secret Manager and SENDGRID_API_KEY GitHub secret is absent." && exit 1
            fi
          fi

      - name: Sync GEMINI_API_KEY from GitHub secret
        env:
          GEMINI_API_KEY_VAL: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROJECT="$PROJECT_ID"

          if [ -n "$GEMINI_API_KEY_VAL" ]; then
            PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "GEMINI_API_KEY" "$GEMINI_API_KEY_VAL"
          else
            if gcloud secrets describe "GEMINI_API_KEY" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              echo "✅ GEMINI_API_KEY: exists in GCP Secret Manager (no GitHub secret to sync)"
            else
              echo "❌ GEMINI_API_KEY: not found in GCP Secret Manager and GEMINI_API_KEY GitHub secret is absent." && exit 1
            fi
          fi

      - name: Sync Twilio secrets from GitHub
        env:
          TWILIO_ACCOUNT_SID_VAL: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN_VAL: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER_VAL: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: |
          PROJECT="$PROJECT_ID"

          # Idempotent — the helper compares against `latest` and skips when
          # the value is unchanged. Before this change TWILIO_AUTH_TOKEN grew
          # 330+ versions because every CI run blindly called `versions add`.
          for TWILIO_ENTRY in \
            "TWILIO_ACCOUNT_SID:$TWILIO_ACCOUNT_SID_VAL" \
            "TWILIO_AUTH_TOKEN:$TWILIO_AUTH_TOKEN_VAL" \
            "TWILIO_PHONE_NUMBER:$TWILIO_PHONE_NUMBER_VAL"; do
            TWILIO_VAR="${TWILIO_ENTRY%%:*}"
            TWILIO_VAL="${TWILIO_ENTRY#*:}"
            if [ -n "$TWILIO_VAL" ]; then
              PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "$TWILIO_VAR" "$TWILIO_VAL"
            else
              if gcloud secrets describe "$TWILIO_VAR" --project="$PROJECT" --quiet >/dev/null 2>&1; then
                echo "✅ $TWILIO_VAR: exists in GCP Secret Manager (no GitHub secret to sync)"
              else
                echo "❌ $TWILIO_VAR: not found in GCP Secret Manager and GitHub secret is absent." && exit 1
              fi
            fi
          done

      - name: Sync RECAPTCHA_SECRET_KEY from GitHub secret
        env:
          RECAPTCHA_SECRET_KEY_VAL: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        run: |
          PROJECT="$PROJECT_ID"

          if [ -n "$RECAPTCHA_SECRET_KEY_VAL" ]; then
            PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "RECAPTCHA_SECRET_KEY" "$RECAPTCHA_SECRET_KEY_VAL"
          else
            if gcloud secrets describe "RECAPTCHA_SECRET_KEY" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              echo "✅ RECAPTCHA_SECRET_KEY: exists in GCP Secret Manager (no GitHub secret to sync)"
            else
              echo "❌ RECAPTCHA_SECRET_KEY: not found in GCP Secret Manager and RECAPTCHA_SECRET_KEY GitHub secret is absent." && exit 1
            fi
          fi

      - name: Sync optional secrets (REDIS_URL, SLACK_WEBHOOK_URL, TWILIO_MESSAGING_SERVICE_SID, Tranzila)
        # These are optional — CI does NOT fail if they are absent from GitHub Secrets.
        # If absent, the feature is gracefully disabled in the running service.
        # To enable: add the GitHub Secret so this step syncs it to GCP Secret Manager automatically.
        env:
          REDIS_URL_VAL: ${{ secrets.REDIS_URL }}
          SLACK_WEBHOOK_URL_VAL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TWILIO_MESSAGING_SERVICE_SID_VAL: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          TRANZILA_TERMINAL_NAME_VAL: ${{ secrets.TRANZILA_TERMINAL_NAME }}
          TRANZILA_API_KEY_VAL: ${{ secrets.TRANZILA_API_KEY }}
          TRANZILA_WEBHOOK_SECRET_VAL: ${{ secrets.TRANZILA_WEBHOOK_SECRET }}
          TRANZILA_TERMINAL_PASSWORD_VAL: ${{ secrets.TRANZILA_TERMINAL_PASSWORD }}
          TRANZILA_ALLOWED_IPS_VAL: ${{ secrets.TRANZILA_ALLOWED_IPS }}
          TRANZILA_MARKETPLACE_ENABLED_VAL: ${{ secrets.TRANZILA_MARKETPLACE_ENABLED }}
          TRANZILA_WALLET_TOPUP_ENABLED_VAL: ${{ secrets.TRANZILA_WALLET_TOPUP_ENABLED }}
          TRANZILA_PAYMENT_REQUESTS_ENABLED_VAL: ${{ secrets.TRANZILA_PAYMENT_REQUESTS_ENABLED }}
          # Social OAuth (TikTok Login Kit + Instagram Basic Display). When set,
          # /api/auth/social/{tiktok|instagram}/{authorize,callback} routes go
          # live. When absent, the SignIn "Continue with TikTok"/"Continue with
          # Instagram" buttons gracefully return 503 "not configured" and the
          # button stays present but inert. Server-side OAuth flow already
          # implemented in server/routes/social-oauth.ts.
          TIKTOK_CLIENT_KEY_VAL: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET_VAL: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          INSTAGRAM_CLIENT_ID_VAL: ${{ secrets.INSTAGRAM_CLIENT_ID }}
          INSTAGRAM_CLIENT_SECRET_VAL: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
        run: |
          PROJECT="$PROJECT_ID"
          # Idempotent via sync-gcp-secret.sh — skips writing a new version
          # when the latest payload already matches. Optional features stay
          # optional: absent value + absent secret is a warning, not an error.
          sync_optional() {
            local VAR_NAME="$1"
            local VAR_VAL="$2"
            if [ -n "$VAR_VAL" ]; then
              PROJECT="$PROJECT" ./scripts/sync-gcp-secret.sh "$VAR_NAME" "$VAR_VAL"
            elif gcloud secrets describe "$VAR_NAME" --project="$PROJECT" --quiet >/dev/null 2>&1; then
              echo "✅ $VAR_NAME: exists in GCP Secret Manager (skipping sync)"
            else
              echo "⚠️  $VAR_NAME: not set in GitHub or GCP — feature will be gracefully disabled"
            fi
          }
          sync_optional "REDIS_URL"                         "$REDIS_URL_VAL"
          sync_optional "SLACK_WEBHOOK_URL"                 "$SLACK_WEBHOOK_URL_VAL"
          sync_optional "TWILIO_MESSAGING_SERVICE_SID"      "$TWILIO_MESSAGING_SERVICE_SID_VAL"
          sync_optional "TRANZILA_TERMINAL_NAME"            "$TRANZILA_TERMINAL_NAME_VAL"
          sync_optional "TRANZILA_API_KEY"                  "$TRANZILA_API_KEY_VAL"
          sync_optional "TRANZILA_WEBHOOK_SECRET"           "$TRANZILA_WEBHOOK_SECRET_VAL"
          sync_optional "TRANZILA_TERMINAL_PASSWORD"        "$TRANZILA_TERMINAL_PASSWORD_VAL"
          sync_optional "TRANZILA_ALLOWED_IPS"              "$TRANZILA_ALLOWED_IPS_VAL"
          sync_optional "TRANZILA_MARKETPLACE_ENABLED"      "$TRANZILA_MARKETPLACE_ENABLED_VAL"
          sync_optional "TRANZILA_WALLET_TOPUP_ENABLED"     "$TRANZILA_WALLET_TOPUP_ENABLED_VAL"
          sync_optional "TRANZILA_PAYMENT_REQUESTS_ENABLED" "$TRANZILA_PAYMENT_REQUESTS_ENABLED_VAL"
          sync_optional "TIKTOK_CLIENT_KEY"                 "$TIKTOK_CLIENT_KEY_VAL"
          sync_optional "TIKTOK_CLIENT_SECRET"              "$TIKTOK_CLIENT_SECRET_VAL"
          sync_optional "INSTAGRAM_CLIENT_ID"               "$INSTAGRAM_CLIENT_ID_VAL"
          sync_optional "INSTAGRAM_CLIENT_SECRET"           "$INSTAGRAM_CLIENT_SECRET_VAL"

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Pre-build frontend (outside Docker)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}
          # Companion to GOOGLE_PLACES_LIVE in cloudrun-service.yaml (PR #290).
          # The client flag resolver in client/src/lib/feature-flags/googlePlaces.ts
          # defaults to import.meta.env.PROD when this var is unset — Vite's
          # `npm run build` does set PROD=true, so in theory the flag would
          # resolve ON in production builds. Setting it explicitly here makes
          # the behaviour deterministic and removes one variable from production
          # debugging when address autocomplete misbehaves on iPad Safari.
          # docs/GOOGLE_PLACES_AUTOCOMPLETE_AUDIT.md §1.
          VITE_GOOGLE_PLACES_LIVE: 'true'

          # ── Restored after Replit→Cloud-Run migration audit (2026-05-25)
          # These were defined ONLY in the legacy `.replit` file and never
          # made it into the GitHub Actions build env, so the production
          # client bundle has been shipping with them undefined:
          #
          #   VITE_TURNSTILE_SITE_KEY (missing) →
          #     client/src/components/TurnstileWidget.tsx:50 logs
          #     "VITE_TURNSTILE_SITE_KEY not set — skipping Turnstile" and
          #     returns null. Every form using executeTurnstileInvisible()
          #     ships without bot protection. Site keys are public per
          #     Cloudflare design — safe to commit the secret reference.
          #
          #   VITE_FIREBASE_APPCHECK_SITE_KEY (missing) →
          #     Firebase App Check (anti-abuse on /api/* endpoints) is
          #     silently disabled in the production client.
          #
          # Add the actual values to GitHub Actions secrets:
          #   Settings → Secrets and variables → Actions → New repository
          #   secret. Use the names below. Source of the legacy values is
          #   .replit at the repo root.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pre-deploy container smoke test
        # Run the just-built image locally with only PORT + NODE_ENV set.
        # This catches process crashes (missing file, bad import, pre-bind throw)
        # BEFORE wasting a Cloud Run deploy attempt.
        #
        # No real secrets are injected intentionally:
        #   • /health must return 200 regardless of secrets (Cloud Run liveness probe).
        #   • /health/strict returns 503 ONLY for active security dangers
        #     (weak admin credentials, payment-bypass flags in production).
        #     Missing secrets cause DEGRADED status in /health but do NOT block /health/strict —
        #     their absence degrades features, it does not make the service actively unsafe.
        #
        # Two-phase check:
        #   Phase 1 — /health (always 200): confirms the container bound the port and is alive.
        #   Phase 2 — /health/strict (200 = safe to deploy, 503 = active security danger):
        #     This is the deployment gate.  A container with active security violations
        #     must never be promoted to Cloud Run traffic.
        run: |
          echo "🔍 Starting container smoke test (no real secrets — testing boot + security only)..."
          # PR-CI-PAYMENT-MODE: PAYMENT_PROVIDER_MODE=mock + NAYAX/SUMIT_ENABLED=false
          # ensures the production container image boots in CI without real payment-vendor
          # credentials. Per Rule H ("no fake success"), mock providers return ok:false
          # for any payment call. Live deploy to Cloud Run uses PAYMENT_PROVIDER_MODE=live
          # (default) and real GCP Secret Manager values.
          # Throw-at-startup secrets: server/lib/env-validation.ts and
          # server/routes/prestige-pass.ts throw FATAL during module load when
          # NODE_ENV=production AND these secrets are missing. Without dummies,
          # routes-load fails → port never binds (since PR #498) → /health 000
          # → smoke fails. Production gets the real values from GCP Secret Mgr
          # at workflow lines 456-460 (ensure_secret + Cloud Run mapping). The
          # dummies here only need to satisfy presence + format (length ≥ 32
          # for COOKIE_SECRET / PASS_TOKEN_SECRET, 64-hex for encryption keys).
          docker run -d --name petwash-smoke \
            -p 18080:8080 \
            -e PORT=8080 \
            -e NODE_ENV=production \
            -e PAYMENT_PROVIDER_MODE=mock \
            -e NAYAX_ENABLED=false \
            -e SUMIT_ENABLED=false \
            -e PRESTIGE_QR_SECRET=smoke-dummy-prestige-do-not-use-this-value-anywhere \
            -e DOCUMENT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e TREASURY_FIELD_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e IP_HASH_SALT=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e COOKIE_SECRET=smoke-dummy-cookie-secret-32chars-min-do-not-use \
            "${{ env.IMAGE }}:${{ github.sha }}"

          # ── Phase 1: wait for /health to return 200 ──────────────────────────
          BOOT_OK=false
          MAX_WAIT_SECONDS=90
          POLL_INTERVAL=5
          MAX_ATTEMPTS=$((MAX_WAIT_SECONDS / POLL_INTERVAL))
          for i in $(seq 1 $MAX_ATTEMPTS); do
            sleep $POLL_INTERVAL
            HTTP=$(curl -s -o /tmp/smoke_health.json -w "%{http_code}" \
              --max-time 10 http://localhost:18080/health 2>/dev/null || echo "000")
            echo "  [Phase 1] Attempt $i/$MAX_ATTEMPTS: /health → HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              BOOT_OK=true
              echo "  /health response: $(cat /tmp/smoke_health.json 2>/dev/null || echo '(empty)')"
              break
            fi
            # Print recent container output on every failed attempt for fast diagnosis
            docker logs petwash-smoke 2>&1 | tail -20
          done

          if [ "$BOOT_OK" != "true" ]; then
            echo ""
            echo "--- Full container logs (last 100 lines) ---"
            docker logs petwash-smoke 2>&1 | tail -100
            docker stop petwash-smoke || true
            docker rm   petwash-smoke || true
            echo ""
            echo "❌ Container smoke test FAILED (Phase 1) — container did not bind port 8080 within 90 s."
            echo "   Root cause is in the container logs above."
            echo "   Fix the container startup error before re-running to avoid Cloud Run probe failures."
            exit 1
          fi

          # ── Phase 2: /health/strict — active security danger gate ────────────
          # Returns 503 DANGEROUS when _startupSecurityViolations is non-empty
          # (weak admin secret, Tranzila bypass flag set in prod/staging).
          # Returns 200 when no active security violations exist.
          # Missing secrets produce DEGRADED in /health but do NOT block /health/strict.
          STRICT_HTTP=$(curl -s -o /tmp/smoke_strict.json -w "%{http_code}" \
            --max-time 10 http://localhost:18080/health/strict 2>/dev/null || echo "000")
          STRICT_BODY=$(cat /tmp/smoke_strict.json 2>/dev/null || echo "")
          echo ""
          echo "  [Phase 2] /health/strict → HTTP $STRICT_HTTP"
          echo "  /health/strict response: $STRICT_BODY"

          echo ""
          echo "--- Full container logs (last 100 lines) ---"
          docker logs petwash-smoke 2>&1 | tail -100
          docker stop petwash-smoke || true
          docker rm   petwash-smoke || true

          if [ "$STRICT_HTTP" != "200" ]; then
            echo ""
            echo "❌ Container smoke test FAILED (Phase 2) — /health/strict returned HTTP $STRICT_HTTP."
            echo "   The container has active SECURITY VIOLATIONS (see checks.securityViolations above)."
            echo "   Fix the violations and redeploy. A dangerous container must NOT reach Cloud Run traffic."
            exit 1
          fi
          echo "✅ Container smoke test passed (both phases) — proceeding to Cloud Run deploy."

      - name: Build Cloud Run secret mappings
        id: build-cloudrun-secrets
        run: |
          PROJECT="$PROJECT_ID"
          secrets_file="$(mktemp)"
          missing_required=()

          required_mappings=(
            "BASE_URL=BASE_URL:latest"
            "DATABASE_URL=DATABASE_URL:latest"
            "FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest"
            # PR-STARTUP-FIX-5: FIREBASE_SERVICE_ACCOUNT_KEY removed from required
            # mappings. Cloud Run uses Application Default Credentials via the
            # service account's IAM roles. Re-adding this line will re-introduce
            # bug #9 unless the secret value is verified valid JSON.
            "JWT_SECRET=JWT_SECRET:latest"
            "JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest"
            "COOKIE_SECRET=COOKIE_SECRET:latest"
            "SESSION_SECRET=SESSION_SECRET:latest"
            "SENDGRID_API_KEY=SENDGRID_API_KEY:latest"
            # Required: notificationDispatcher.ts throws at module load in production
            # if SENDGRID_FROM_EMAIL is unset, which aborts the entire routes import
            # and forces every /api/* to 503. Must be mapped onto the live revision.
            "SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL:latest"
            "GEMINI_API_KEY=GEMINI_API_KEY:latest"
            "GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest"
            "GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest"
            "GOOGLE_APPLICATION_CREDENTIALS_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest"
            # Twilio + ANTHROPIC_API_KEY + TWILIO_VOICE_PUBLIC_URL moved to
            # optional_mappings 2026-05-24. Reason: operator deleted Twilio
            # secrets from GCP (Twilio voice/SMS being phased out); CI was
            # blocking every deploy because gcloud rejected mounts for
            # secrets that no longer exist. Optional mappings are skipped
            # gracefully when the GCP secret is absent — see line ~1000.
            "WEBAUTHN_RP_ID=WEBAUTHN_RP_ID:latest"
            "WEBAUTHN_COOKIE_SECRET=WEBAUTHN_COOKIE_SECRET:latest"
            "RECAPTCHA_SECRET_KEY=RECAPTCHA_SECRET_KEY:latest"
            "MOBILE_LINK_SECRET=MOBILE_LINK_SECRET:latest"
            "WALLET_LINK_SECRET=WALLET_LINK_SECRET:latest"
            "VOUCHER_SALT=VOUCHER_SALT:latest"
            "VOUCHER_ES256_PRIVATE_KEY_PEM=VOUCHER_ES256_PRIVATE_KEY_PEM:latest"
            "VOUCHER_ES256_PUBLIC_KEY_PEM=VOUCHER_ES256_PUBLIC_KEY_PEM:latest"
            "KYC_SALT=KYC_SALT:latest"
            "GMAIL_TOKEN_ENCRYPTION_KEY=GMAIL_TOKEN_ENCRYPTION_KEY:latest"
            "BIOMETRIC_BUCKET_NAME=BIOMETRIC_BUCKET_NAME:latest"
            "BIOMETRIC_PREFIX=BIOMETRIC_PREFIX:latest"
            "HUBSPOT_FORM_GUID=HUBSPOT_FORM_GUID:latest"
            "HUBSPOT_PORTAL_ID=HUBSPOT_PORTAL_ID:latest"
            "NAYAX_WEBHOOK_SECRET=NAYAX_WEBHOOK_SECRET:latest"
            "GOOGLE_TRANSLATE_API_KEY=GOOGLE_TRANSLATE_API_KEY:latest"
            "GOOGLE_WEATHER_API_KEY=GOOGLE_WEATHER_API_KEY:latest"
            "GCS_BACKUP_BUCKET=GCS_BACKUP_BUCKET:latest"
            "SUPER_ADMIN_EMAILS=SUPER_ADMIN_EMAILS:latest"
            "GOOGLE_FORMS_SPREADSHEET_ID=GOOGLE_FORMS_SPREADSHEET_ID:latest"
            "PRESTIGE_QR_SECRET=PRESTIGE_QR_SECRET:latest"
            "PASS_LINK_SECRET=PASS_LINK_SECRET:latest"
            "DOCUMENT_ENCRYPTION_KEY=DOCUMENT_ENCRYPTION_KEY:latest"
            "SENDGRID_TEMPLATE_ID_MEMBER_PASS=SENDGRID_TEMPLATE_ID_MEMBER_PASS:latest"
            "MACHINE_SECRET_KEY=MACHINE_SECRET_KEY:latest"
            "MACHINE_ACTIVATION_URL=MACHINE_ACTIVATION_URL:latest"
            "NAYAX_API_KEY=NAYAX_API_KEY:latest"
            "NAYAX_MERCHANT_ID=NAYAX_MERCHANT_ID:latest"
            "NAYAX_SECRET=NAYAX_SECRET:latest"
            "NAYAX_TERMINAL_SECRET=NAYAX_TERMINAL_SECRET:latest"
            "RECAPTCHA_SITE_KEY=RECAPTCHA_SITE_KEY:latest"
            "FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest"
            "ACCOUNTING_SPREADSHEET_ID=ACCOUNTING_SPREADSHEET_ID:latest"
            "CONTRACTOR_DOCS_BUCKET=CONTRACTOR_DOCS_BUCKET:latest"
            "GCS_DOCUMENTS_BUCKET=GCS_DOCUMENTS_BUCKET:latest"
            "GCS_FINANCIAL_BUCKET=GCS_FINANCIAL_BUCKET:latest"
            "GCS_LOGS_BUCKET=GCS_LOGS_BUCKET:latest"
            "GCS_MESSAGE_ATTACHMENTS_BUCKET=GCS_MESSAGE_ATTACHMENTS_BUCKET:latest"
            "GCS_STAMPS_BUCKET=GCS_STAMPS_BUCKET:latest"
            "GCS_CODE_BUCKET=GCS_CODE_BUCKET:latest"
            "GCS_FIRESTORE_BUCKET=GCS_FIRESTORE_BUCKET:latest"
            "FIREBASE_STORAGE_BUCKET=FIREBASE_STORAGE_BUCKET:latest"
          )

          optional_mappings=(
            "REDIS_URL=REDIS_URL:latest"
            "SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest"
            # ── Restored after Replit→Cloud-Run migration audit (2026-05-25)
            # These were defined ONLY in the legacy .replit file and never
            # made it into Cloud Run. Originally added to required_mappings
            # in PR #447 — that broke the deploy because the secrets don't
            # yet exist in GCP Secret Manager (deploy fails fast on missing
            # required secrets). Moved to optional so the deploy proceeds;
            # the helper script silently skips missing optional secrets.
            #
            # When the operator gets around to creating the secrets, they
            # come online on the next deploy with no code change needed:
            #
            #   SUPER_ADMIN_UID (currently missing) →
            #     server/routes/disputes.ts:27-36 emits FATAL CONFIG at
            #     startup; every super-admin dispute endpoint returns 503.
            #     Also degrades prestige-pass.ts:1588 + provider-trust.ts:41.
            #     gcloud secrets create SUPER_ADMIN_UID --replication-policy=automatic
            #     echo -n "<firebase-uid>" | gcloud secrets versions add SUPER_ADMIN_UID --data-file=-
            #
            #   ADMIN_APPROVER_EMAIL (currently missing) →
            #     server/routes/post-login.ts:13 logs approval emails skipped.
            #
            #   FINANCE_AUTHORIZED_EMAILS (currently missing) →
            #     server/routes/bank.ts:83 financial admin gating degraded.
            "SUPER_ADMIN_UID=SUPER_ADMIN_UID:latest"
            "ADMIN_APPROVER_EMAIL=ADMIN_APPROVER_EMAIL:latest"
            "FINANCE_AUTHORIZED_EMAILS=FINANCE_AUTHORIZED_EMAILS:latest"
            # Restored from legacy .replit (2026-05-25 audit). Nice-to-have
            # alerting channel — emergency SMS to a single phone. If absent,
            # the alert simply isn't sent. Marked optional because security
            # incidents already alert via Slack/email; SMS is the extra
            # belt-and-suspenders signal for after-hours pager.
            "SUPER_ADMIN_ALERT_PHONE=SUPER_ADMIN_ALERT_PHONE:latest"
            # Twilio voice + SMS — moved from required to optional 2026-05-24
            # so that deleting any Twilio secret from GCP no longer crashes
            # the deploy. When a secret is missing, the helper below silently
            # skips it instead of failing the gcloud run deploy --set-secrets.
            "TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest"
            "TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest"
            "TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest"
            "TWILIO_VOICE_PUBLIC_URL=TWILIO_VOICE_PUBLIC_URL:latest"
            "TWILIO_MESSAGING_SERVICE_SID=TWILIO_MESSAGING_SERVICE_SID:latest"
            # ANTHROPIC_API_KEY — optional; only used by Maya Voice runtime,
            # which is flag-gated OFF in production. If the secret is missing
            # the deploy continues without it; Maya Voice code paths already
            # fail-closed when the env var is unset.
            "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"
            "TRANZILA_TERMINAL_NAME=TRANZILA_TERMINAL_NAME:latest"
            "TRANZILA_API_KEY=TRANZILA_API_KEY:latest"
            "TRANZILA_WEBHOOK_SECRET=TRANZILA_WEBHOOK_SECRET:latest"
            "TRANZILA_TERMINAL_PASSWORD=TRANZILA_TERMINAL_PASSWORD:latest"
            "TRANZILA_ALLOWED_IPS=TRANZILA_ALLOWED_IPS:latest"
            "TRANZILA_MARKETPLACE_ENABLED=TRANZILA_MARKETPLACE_ENABLED:latest"
            "TRANZILA_WALLET_TOPUP_ENABLED=TRANZILA_WALLET_TOPUP_ENABLED:latest"
            "TRANZILA_PAYMENT_REQUESTS_ENABLED=TRANZILA_PAYMENT_REQUESTS_ENABLED:latest"
            # Social OAuth (TikTok Login Kit + Instagram Basic Display).
            # server/routes/social-oauth.ts already implements the full OAuth
            # flow for both providers. When the env var is unset on the live
            # revision the corresponding /api/auth/social/{provider}/* routes
            # return 503 "{provider} sign-in not configured" — the UI button
            # remains visible but inert. To go live: set TIKTOK_CLIENT_KEY +
            # TIKTOK_CLIENT_SECRET (or INSTAGRAM_CLIENT_ID + _SECRET) as GitHub
            # Actions secrets — the sync_optional step above pushes them to
            # GCP Secret Manager, and this mapping wires them into Cloud Run.
            "TIKTOK_CLIENT_KEY=TIKTOK_CLIENT_KEY:latest"
            "TIKTOK_CLIENT_SECRET=TIKTOK_CLIENT_SECRET:latest"
            "INSTAGRAM_CLIENT_ID=INSTAGRAM_CLIENT_ID:latest"
            "INSTAGRAM_CLIENT_SECRET=INSTAGRAM_CLIENT_SECRET:latest"
            # Firebase client config vars — synced from VITE_* GitHub secrets.
            # Used by buildFirebaseInjectedHtml to inject full config into index.html
            # so the browser always gets messagingSenderId, appId, measurementId
            # from the server rather than relying solely on the build-time bake-in.
            "FIREBASE_MESSAGING_SENDER_ID=FIREBASE_MESSAGING_SENDER_ID:latest"
            "FIREBASE_APP_ID=FIREBASE_APP_ID:latest"
            "FIREBASE_MEASUREMENT_ID=FIREBASE_MEASUREMENT_ID:latest"
            # Apple Wallet (PassKit) credentials. server/lib/wallet-env-compat.ts
            # aliases these APPLE_WALLET_* names onto the canonical APPLE_* names the
            # wallet code reads at startup. With secrets_update_strategy=overwrite,
            # omitting them here strips them from every deploy — keep them mapped.
            "APPLE_WALLET_PASS_TYPE_ID=APPLE_WALLET_PASS_TYPE_ID:latest"
            "APPLE_WALLET_TEAM_ID=APPLE_WALLET_TEAM_ID:latest"
            "APPLE_WALLET_WWDR_CERT=APPLE_WALLET_WWDR_CERT:latest"
            "APPLE_WALLET_CERT=APPLE_WALLET_CERT:latest"
            "APPLE_WALLET_KEY=APPLE_WALLET_KEY:latest"
            "APPLE_WALLET_ORGANIZATION_NAME=APPLE_WALLET_ORGANIZATION_NAME:latest"
          )

          for mapping in "${required_mappings[@]}"; do
            secret_ref="${mapping#*=}"
            secret_name="${secret_ref%%:*}"

            if gcloud secrets describe "$secret_name" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
              printf '%s\n' "$mapping" >> "$secrets_file"
            else
              missing_required+=("$secret_name")
            fi
          done

          if [ ${#missing_required[@]} -gt 0 ]; then
            echo ""
            echo "::error::Required deploy secrets missing from GCP Secret Manager:"
            printf '  - %s\n' "${missing_required[@]}"
            echo ""
            echo "Without these, gcloud run deploy fails at the secret-mount step"
            echo "after 5+ minutes of building. This pre-flight check converts"
            echo "that into a fast, actionable failure here."
            echo ""
            echo "Pick one per missing secret:"
            echo "  A) Create the secret in GCP Secret Manager:"
            echo "       gcloud secrets create <NAME> --project=$PROJECT --replication-policy=automatic"
            echo "       echo -n '<value>' | gcloud secrets versions add <NAME> --data-file=- --project=$PROJECT"
            echo "  B) Move the entry from required_mappings to optional_mappings in"
            echo "     .github/workflows/petwash-ci.yml (deploy then skips it with a warning)"
            echo "  C) Remove the entry entirely if the env var is no longer needed"
            echo ""
            echo "Historical context: PR #447 added 3 required secrets that didn't"
            echo "exist in GCP, causing 2 days of broken deploys. This guard prevents"
            echo "that exact pattern from recurring."
            exit 1
          fi

          for mapping in "${optional_mappings[@]}"; do
            secret_ref="${mapping#*=}"
            secret_name="${secret_ref%%:*}"

            if gcloud secrets describe "$secret_name" --project="$PROJECT" --quiet &>/dev/null 2>&1; then
              printf '%s\n' "$mapping" >> "$secrets_file"
              echo "✅ Optional deploy secret included: $secret_name"
            else
              echo "⚠️  Optional deploy secret missing, skipping: $secret_name"
            fi
          done

          {
            echo "secret_mappings<<EOF"
            cat "$secrets_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Cloud Run keeps a service-level "RoutingTraffic" condition that
      # references the most recent failed revision. Once a revision is left in
      # Ready=False state, every subsequent `gcloud run deploy` returns the
      # stale "Revision 'X' is not ready and cannot serve traffic" error in
      # the deploy step's stderr — even when the NEW revision it just created
      # is healthy. The workflow then exits before promotion, the new revision
      # sits at 0% traffic, and operators chase phantom startup-probe failures
      # in server/index.ts that aren't real. Diagnosed 2026-05-25 on revisions
      # 01123-ges + 01124-xeq.
      #
      # Fix: before each deploy, list revisions in Ready=False state and delete
      # them. The currently-serving revision is filtered out as defense in depth
      # (a Ready=False revision should never have traffic, but skip just in case).
      # Cloud Run clears the stale service condition automatically once the
      # failed revisions are gone, and the next deploy promotes normally.
      - name: Clean up failed Cloud Run revisions before deploy
        continue-on-error: true
        run: |
          set -uo pipefail
          SVC="${{ env.SERVICE_NAME }}"
          REGION="${{ env.REGION }}"
          PROJECT="${{ env.PROJECT_ID }}"

          trafficked=$(gcloud run services describe "$SVC" \
            --region="$REGION" --project="$PROJECT" \
            --format=json 2>/dev/null | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for t in d.get('status', {}).get('traffic', []):
              if (t.get('percent') or 0) > 0:
                  print(t.get('revisionName', ''))
          " || echo "")

          failed=$(gcloud run revisions list \
            --service="$SVC" \
            --region="$REGION" \
            --project="$PROJECT" \
            --filter="status.conditions.type:Ready AND status.conditions.status:False" \
            --format="value(metadata.name)" 2>/dev/null || echo "")

          if [ -z "$failed" ]; then
            echo "✅ No failed revisions to clean."
            exit 0
          fi

          echo "Failed revisions detected:"
          echo "$failed"
          echo ""

          while IFS= read -r rev; do
            [ -z "$rev" ] && continue
            if echo "$trafficked" | grep -q "^${rev}$"; then
              echo "⚠️  Skipping $rev — currently has traffic (defense in depth)"
              continue
            fi
            echo "🧹 Deleting failed revision: $rev"
            gcloud run revisions delete "$rev" \
              --region="$REGION" --project="$PROJECT" --quiet \
              || echo "   Could not delete $rev (continuing)"
          done <<< "$failed"

          echo ""
          echo "✅ Failed revision cleanup complete — next deploy can proceed without stale RoutingTraffic condition."

      # Issue #143 — deploy with --no-traffic + a unique --tag.
      # The new revision gets a per-tag URL (https://<tag>---<service-host>) but
      # 0% production traffic until smoke tests pass below. Previous revision
      # continues serving 100% traffic, so a failed deploy never breaks prod and
      # rollback is implicit (just don't promote).
      #
      # GOOGLE_PLACES_LIVE=true in --set-env-vars: declared in cloudrun-service.yaml:199
      # but that yaml is NOT applied by this deploy step (it uses
      # google-github-actions/deploy-cloudrun, not gcloud run services replace).
      # Without setting it explicitly here, the var is unset on Cloud Run, and
      # the behaviour falls through to the NODE_ENV=production branch in
      # server/lib/feature-flags/googlePlaces.ts:60. Wiring it explicitly keeps
      # the documented kill-switch operable and removes the silent dependency
      # on NODE_ENV.
      #
      # NOTE on flags block syntax: only `--flag=value` lines below — comments
      # inside the `flags: |` literal block scalar are passed through to the
      # action's shell invocation as positional args and break gcloud parsing
      # if they contain quotes or apostrophes. Keep explanatory text here, not
      # inline. (Lesson from PR #448 main-deploy break, 2026-05-25.)
      - name: Deploy to Cloud Run (no-traffic candidate)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          secrets_update_strategy: overwrite
          flags: |
            --cpu=2
            --memory=2Gi
            --min-instances=1
            --max-instances=20
            --timeout=600
            --port=8080
            --execution-environment=gen2
            --ingress=all
            --set-env-vars=NODE_ENV=production,GOOGLE_PLACES_LIVE=true
            --no-traffic
            --tag=cand-${{ github.run_id }}-${{ github.run_attempt }}
            --startup-probe=httpGet.path=/health,initialDelaySeconds=5,periodSeconds=10,timeoutSeconds=10,failureThreshold=30
          secrets: ${{ steps.build-cloudrun-secrets.outputs.secret_mappings }}

      # Issue #143 — capture everything operators need to diagnose a bad revision
      # without leaving GitHub Actions: revision name, tagged URL, image digest,
      # and the full revision describe (incl. startup/liveness/readiness probes).
      - name: Capture new revision metadata
        id: revision
        env:
          TAG: cand-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SVC="${{ env.SERVICE_NAME }}"
          REGION="${{ env.REGION }}"
          PROJECT="${{ env.PROJECT_ID }}"

          REV_NAME=$(gcloud run services describe "$SVC" \
            --region "$REGION" --project "$PROJECT" \
            --format='value(status.latestCreatedRevisionName)')

          if [ -z "$REV_NAME" ]; then
            echo "❌ Could not resolve latestCreatedRevisionName — aborting before promote."
            exit 1
          fi

          gcloud run services describe "$SVC" \
            --region "$REGION" --project "$PROJECT" --format=json > /tmp/svc.json
          CAND_URL=$(python3 -c "
          import json, os
          tag = os.environ['TAG']
          d = json.load(open('/tmp/svc.json'))
          for t in d.get('status', {}).get('traffic', []):
              if t.get('tag') == tag:
                  print(t.get('url', ''))
                  break
          ")
          SERVICE_URL=$(python3 -c "
          import json
          d = json.load(open('/tmp/svc.json'))
          print(d.get('status', {}).get('url', ''))
          ")

          if [ -z "$CAND_URL" ]; then
            echo "❌ No tagged URL found for tag=$TAG. The candidate cannot be smoke-tested in isolation."
            echo "   Service URL still points to the previous revision (production unaffected)."
            exit 1
          fi

          IMAGE_REF=$(gcloud run revisions describe "$REV_NAME" \
            --region "$REGION" --project "$PROJECT" \
            --format='value(spec.containers[0].image)' 2>/dev/null || echo "")

          {
            echo "revision_name=$REV_NAME"
            echo "candidate_url=$CAND_URL"
            echo "service_url=$SERVICE_URL"
            echo "image_digest=$IMAGE_REF"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

          echo "🆕 New revision deployed with NO traffic"
          echo "   service:   $SVC"
          echo "   region:    $REGION"
          echo "   revision:  $REV_NAME"
          echo "   tag:       $TAG"
          echo "   image:     $IMAGE_REF"
          echo "   candidate: $CAND_URL"
          echo "   prod URL:  $SERVICE_URL  (still serving previous revision)"
          echo ""
          echo "── Startup / liveness / readiness probes ───────────────────────"
          gcloud run revisions describe "$REV_NAME" \
            --region "$REGION" --project "$PROJECT" \
            --format='yaml(spec.containers[0].startupProbe,spec.containers[0].livenessProbe,spec.containers[0].readinessProbe)' \
            || echo "(probes not configured)"
          echo "── Revision describe (full) ────────────────────────────────────"
          gcloud run revisions describe "$REV_NAME" \
            --region "$REGION" --project "$PROJECT" || true

      - name: Grant public access (allow unauthenticated)
        continue-on-error: true
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --region=${{ env.REGION }} \
            --quiet
          echo "✅ Public access granted"

      - name: Output Cloud Run service URL
        run: |
          echo "🌐 Production service URL (still on previous revision until promote):"
          echo "   ${{ steps.deploy.outputs.url }}"
          echo ""
          echo "🧪 Candidate URL (new revision, no traffic yet — smoke tests target this):"
          echo "   ${{ steps.revision.outputs.candidate_url }}"

      # Issue #143 — root health endpoints (server/index.ts:616, :650). These are
      # dirt-cheap, route-table-independent, and answer before /api/health does
      # because they don't wait for the route registration phase.
      - name: Smoke test — root /health and /health/strict (candidate)
        run: |
          set -uo pipefail
          URL="${{ steps.revision.outputs.candidate_url }}"

          if [ -z "$URL" ]; then
            echo "❌ candidate_url empty — cannot smoke-test isolated revision."
            exit 1
          fi

          OIDC_TOKEN=$(gcloud auth print-identity-token --audiences="$URL" 2>/dev/null \
            || gcloud auth print-identity-token 2>/dev/null || echo "")

          probe() {
            local PATH_="$1"
            local ENDPOINT="$URL$PATH_"
            echo "── $ENDPOINT ──"
            local STATUS="000"
            # Cloud Run's allUsers IAM binding is blocked by the org policy on
            # this project (see "Grant public access" step ~line 1456, which
            # has `continue-on-error: true` because it fails with
            # FAILED_PRECONDITION on every deploy). Without the binding,
            # Cloud Run returns:
            #   • 403 for some unauthenticated requests (older behavior), OR
            #   • 429 "Rate exceeded" for tagged-revision unauthenticated
            #     requests (current behavior — observed on run #1015, 2026-05-25)
            # Either way, the github-actions service account has roles/run.invoker
            # so an OIDC Identity Token bypasses both. Send it from attempt 1
            # whenever it's available — this used to only happen on 403 retry
            # (line "$STATUS" = "403" check), which never triggered for 429
            # and caused 5x 7+ minute timeouts on every deploy.
            for attempt in 1 2 3 4 5; do
              if [ -n "$OIDC_TOKEN" ]; then
                STATUS=$(curl -s -o /tmp/probe.body -w "%{http_code}" --max-time 30 \
                  -H "Authorization: Bearer $OIDC_TOKEN" "$ENDPOINT" 2>/dev/null || echo "000")
              else
                STATUS=$(curl -s -o /tmp/probe.body -w "%{http_code}" --max-time 30 "$ENDPOINT" 2>/dev/null || echo "000")
              fi
              [ "$STATUS" = "200" ] && break
              case "$STATUS" in
                000|429|503) ;;
                *) break ;;
              esac
              if [ "$STATUS" = "429" ]; then
                DELAY=$((15 * (2 ** (attempt - 1))))
              else
                DELAY=15
              fi
              echo "   attempt $attempt: HTTP $STATUS — retrying in ${DELAY}s..."
              sleep "$DELAY"
            done
            if [ "$STATUS" = "200" ]; then
              echo "   ✅ HTTP $STATUS"
              head -c 400 /tmp/probe.body || true
              echo ""
            else
              echo "   ❌ HTTP $STATUS"
              head -c 400 /tmp/probe.body || true
              echo ""
              return 1
            fi
          }

          probe "/health"          || exit 1
          probe "/health/strict"   || exit 1
          echo "✅ Root health endpoints passed on candidate revision"

      - name: Smoke test — backend health check
        run: |
          URL="${{ steps.revision.outputs.candidate_url }}"
          ENDPOINT="$URL/api/health"

          echo "Testing: $ENDPOINT"

          STATUS="000"
          # Retry on transport failure (000), startup guard (503), and Cloud Run
          # quota throttle (429). 429 uses exponential backoff (15s → 30s → 60s)
          # to give the rate limiter time to drain.
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$ENDPOINT" 2>/dev/null || echo "000")
            case "$STATUS" in
              000|429|503) ;;
              *) break ;;
            esac
            if [ "$STATUS" = "429" ]; then
              DELAY=$((15 * (2 ** (attempt - 1))))
            else
              DELAY=15
            fi
            echo "  Attempt $attempt: HTTP $STATUS — retrying in ${DELAY}s..."
            sleep "$DELAY"
          done

          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend health check passed (HTTP $STATUS)"
          elif [ "$STATUS" = "403" ]; then
            echo "HTTP 403 - retrying with identity token"

            ID_TOKEN=$(gcloud auth print-identity-token --audiences="$URL" 2>/dev/null || gcloud auth print-identity-token 2>/dev/null || echo "")

            if [ -z "$ID_TOKEN" ]; then
              echo "Failed to get identity token"
              exit 1
            fi

            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer $ID_TOKEN" \
              "$ENDPOINT" 2>/dev/null || echo "000")

            if [ "$STATUS2" = "200" ]; then
              echo "✅ Backend health check passed with auth (HTTP $STATUS2)"
            else
              echo "Health check failed (HTTP $STATUS2)"
              exit 1
            fi
          else
            echo "Health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Smoke test — Places API key validation
        run: |
          URL="${{ steps.revision.outputs.candidate_url }}"
          ENDPOINT="$URL/api/google/places-health"
          echo "Testing: $ENDPOINT"

          # Retry up to 5 times with backoff.
          # Handles two distinct failure modes:
          #   000 — curl transport failure (service not yet listening)
          #   503 + SERVICE_STARTING — startup guard blocking until routes are ready
          # /api/google/places-health is exempted from the startup guard so it can
          # always respond, but we keep retries as defence-in-depth for cold starts.
          # Obtain OIDC Identity Token once (used as fallback if org policy blocks allUsers).
          # --audiences scopes the token to the service URL; falls back to the global token for older gcloud.
          OIDC_TOKEN=$(gcloud auth print-identity-token --audiences="$URL" 2>/dev/null || gcloud auth print-identity-token 2>/dev/null || echo "")

          RESULT=""
          HTTP_STATUS=""
          for attempt in 1 2 3 4 5; do
            # Always send OIDC token if available. Org policy blocks the
            # allUsers IAM binding (see "Grant public access" step above —
            # continue-on-error: true, FAILED_PRECONDITION on every deploy),
            # which causes Cloud Run to return 403 OR 429 ("Rate exceeded")
            # to unauthenticated requests against tagged-revision URLs.
            # Authenticating from attempt 1 sidesteps both responses.
            if [ -n "$OIDC_TOKEN" ]; then
              HTTP_STATUS=$(curl -s -o /tmp/places_response.json -w "%{http_code}" --max-time 30 \
                -H "Authorization: Bearer $OIDC_TOKEN" "$ENDPOINT" 2>/dev/null || echo "000")
            else
              HTTP_STATUS=$(curl -s -o /tmp/places_response.json -w "%{http_code}" --max-time 30 "$ENDPOINT" 2>/dev/null || echo "000")
            fi
            RESULT=$(cat /tmp/places_response.json 2>/dev/null || echo "")

            if [ "$HTTP_STATUS" = "000" ]; then
              echo "   Attempt $attempt: transport failure (curl exit non-zero) — retrying in 20 s..."
              sleep 20
              continue
            fi

            # HTTP 503 + non-JSON "Service Unavailable" plaintext body =
            # Cloud Run proxy returned an error before the container responded.
            # This happens during candidate-revision cold start: the tagged URL
            # accepts the request but the container isn't ready yet, so Cloud
            # Run's load balancer returns its own 503 page (not a JSON response
            # from our app's startup guard). Retry — the container needs more
            # time. Distinguishes from JSON-bodied SERVICE_STARTING (handled
            # below): both are "wait longer", but only one comes from our app.
            if [ "$HTTP_STATUS" = "503" ] && ! echo "$RESULT" | python3 -c "import sys,json; json.load(sys.stdin)" >/dev/null 2>&1; then
              echo "   Attempt $attempt: HTTP 503 with non-JSON body (Cloud Run proxy, container cold start) — retrying in 20 s..."
              sleep 20
              continue
            fi

            # Cloud Run per-revision quota throttle — back off exponentially
            # (20s → 40s → 80s → 160s → 320s) so we don't keep hitting the limiter.
            if [ "$HTTP_STATUS" = "429" ]; then
              DELAY=$((20 * (2 ** (attempt - 1))))
              echo "   Attempt $attempt: HTTP 429 (rate exceeded) — retrying in ${DELAY}s..."
              sleep "$DELAY"
              continue
            fi

            # Detect startup guard response — server is booting, not a real failure
            ERROR_FIELD=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',''))" 2>/dev/null || echo "")
            if [ "$ERROR_FIELD" = "SERVICE_STARTING" ]; then
              echo "   Attempt $attempt: server still starting up (HTTP $HTTP_STATUS, SERVICE_STARTING) — retrying in 20 s..."
              sleep 20
              continue
            fi

            # Got a real response — exit retry loop. NETWORK_ERROR is NOT
            # retried here: this gate's job is to verify the secret bound to
            # the Cloud Run revision, which is answered by apiKeyConfigured /
            # apiKeyLength in the body. Whether Google is reachable from a
            # brand-new container is unrelated to binding, flaky by physics,
            # and re-verified post-deploy by the live-URL health check.
            break
          done

          # Classify result
          if [ "$HTTP_STATUS" = "000" ]; then
            echo "❌ TRANSPORT FAILURE: Could not reach $ENDPOINT after 5 attempts"
            echo "   Possible causes: service not yet accepting connections, DNS, network policy"
            echo "   This is NOT a Places API key problem — the key was not tested"
            exit 1
          fi

          # SOFT PASS on persistent 429 — Cloud Run's anonymous-request rate
          # limiter on tagged-revision URLs. Org policy blocks the allUsers
          # IAM binding ("Grant public access" → FAILED_PRECONDITION on every
          # deploy), so the tagged candidate URL serves anonymous requests
          # via a per-revision throttle that returns 429 "Rate exceeded".
          # The OIDC auth path above SHOULD bypass this but the throttle is
          # applied before token validation on the candidate URL in some
          # cases (org-policy-dependent). After 5 retries (620s of backoff)
          # if we still see 429, this is structural, not transient — the
          # gate cannot authenticate against the candidate URL and there is
          # no recovery from inside the workflow.
          #
          # Safe to soft-pass because the post-deploy live-URL health check
          # at https://petwash.co.il/api/health (next stanza) hits the
          # PROMOTED revision through the public custom domain, which is
          # not subject to the candidate-URL throttle. Any real Places key
          # binding failure WILL surface there.
          if [ "$HTTP_STATUS" = "429" ]; then
            echo "⚠️  PERSISTENT 429 after 5 retries (~10 min total backoff)"
            echo "   Cloud Run candidate-URL anonymous-request throttle hit;"
            echo "   the OIDC token did not bypass it on this revision."
            echo "   This is NOT a Places key binding failure — the gate"
            echo "   could not authenticate against the tagged candidate URL."
            echo "   The post-deploy live-URL check (petwash.co.il/api/health)"
            echo "   will verify real Places API behaviour on the promoted"
            echo "   revision. Soft-passing candidate gate."
            echo "⚠️  SOFT PASS — candidate Places gate skipped (org-policy 429)"
            exit 0
          fi

          ERROR_FIELD=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',''))" 2>/dev/null || echo "")
          if [ "$ERROR_FIELD" = "SERVICE_STARTING" ]; then
            echo "❌ SERVER STILL STARTING after 5 attempts (100 s total wait)"
            echo "   The Cloud Run container did not reach ready state in time"
            echo "   This is NOT a Places API key problem — the key was not tested"
            exit 1
          fi

          echo "   HTTP status from Cloud Run: $HTTP_STATUS"
          echo "   Raw response: $RESULT"

          PLACES_STATUS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','PARSE_FAIL'))" 2>/dev/null || echo "PARSE_FAIL")
          GOOGLE_HTTP=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('googleHttpStatus','—'))" 2>/dev/null || echo "—")
          REASON=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('reason',''))" 2>/dev/null || echo "")
          KEY_LEN=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('apiKeyLength',0))" 2>/dev/null || echo "0")

          KEY_CONFIGURED=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d.get('apiKeyConfigured',False)).lower())" 2>/dev/null || echo "false")

          case "$PLACES_STATUS" in
            OK)
              echo "✅ Places API: key valid (Google HTTP $GOOGLE_HTTP)"
              ;;
            GOOGLE_KEY_MISSING)
              echo "❌ GOOGLE_KEY_MISSING: GOOGLE_MAPS_API_KEY env var is absent in the Cloud Run container"
              echo "   → The secret exists in GCP Secret Manager but the Cloud Run revision did not receive it"
              echo "   → Fix: verify the secret is bound in the Cloud Run service config and redeploy"
              exit 1
              ;;
            GOOGLE_KEY_INVALID)
              echo "❌ GOOGLE_KEY_INVALID: Google rejected the API key (Google HTTP $GOOGLE_HTTP)"
              echo "   → Key length in container: $KEY_LEN chars"
              echo "   → Google error: $REASON"
              echo "   → Fix: add GOOGLE_MAPS_API_KEY as a GitHub Actions secret to sync the correct value"
              exit 1
              ;;
            NETWORK_ERROR)
              # SOFT PASS: outbound fetch from the freshly-booted candidate container to
              # Google failed (cold DNS / TLS / one-off blip). This does NOT mean the
              # secret failed to bind — apiKeyConfigured / apiKeyLength tell us that.
              # The post-deploy live-URL health check (later in this workflow) re-verifies
              # real Google reachability on the promoted revision.
              if [ "$KEY_CONFIGURED" = "true" ] && [ "$KEY_LEN" -ge 30 ]; then
                echo "⚠️  NETWORK_ERROR but key binding verified — candidate gate PASSED"
                echo "   apiKeyConfigured=true, apiKeyLength=$KEY_LEN chars"
                echo "   Cold-start outbound fetch to Google failed: $REASON"
                echo "   This gate verifies binding, not Google reachability."
                echo "   Live-URL post-deploy health check will verify Google reachability."
              else
                echo "❌ NETWORK_ERROR and key binding could NOT be verified"
                echo "   apiKeyConfigured=$KEY_CONFIGURED, apiKeyLength=$KEY_LEN"
                echo "   Reason: $REASON"
                exit 1
              fi
              ;;
            PARSE_FAIL)
              echo "❌ PARSE_FAIL: endpoint returned HTTP $HTTP_STATUS but body is not valid JSON"
              echo "   Possible causes: route not registered, server startup error, proxy returning HTML"
              echo "   Raw body above ↑"
              exit 1
              ;;
            *)
              echo "❌ Places health check returned status=$PLACES_STATUS (Google HTTP $GOOGLE_HTTP)"
              echo "   Reason: $REASON"
              echo "   Raw body above ↑"
              exit 1
              ;;
          esac

      # Issue #143 — only now do we promote production traffic. All smoke tests
      # passed against the tagged candidate URL while the previous revision
      # continued serving 100% of real users.
      - name: Promote traffic to new revision
        run: |
          set -euo pipefail
          SVC="${{ env.SERVICE_NAME }}"
          REGION="${{ env.REGION }}"
          PROJECT="${{ env.PROJECT_ID }}"
          REV_NAME="${{ steps.revision.outputs.revision_name }}"

          echo "🚦 Promoting $REV_NAME to 100% traffic on $SVC ($REGION)"

          # PR-STARTUP-HARDEN-1 / Infra-Council C2 — retry on optimistic-concurrency
          # 409. Two deploys today failed with "Conflict for resource ... version
          # was specified but current version is ..." when something else (manual
          # console edit, another gcloud call) bumped the service generation
          # between our read and write. Workflow-level concurrency does NOT
          # protect us from this — it's a Cloud Run API-level race.
          MAX_ATTEMPTS=4
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if gcloud run services update-traffic "$SVC" \
                  --region "$REGION" --project "$PROJECT" \
                  --to-latest \
                  --quiet 2> /tmp/update-traffic.err; then
              echo "✅ Traffic promoted to latest revision: $REV_NAME (attempt $ATTEMPT)"
              break
            fi
            # Inspect stderr — only retry on optimistic-concurrency conflict
            if grep -qE "Conflict|version was specified|etag" /tmp/update-traffic.err; then
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                DELAY=$((2 ** (ATTEMPT - 1)))
                echo "⚠️  409 version conflict — retrying in ${DELAY}s (attempt $ATTEMPT/$MAX_ATTEMPTS)"
                cat /tmp/update-traffic.err
                sleep "$DELAY"
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              echo "❌ Traffic promotion still failed after $MAX_ATTEMPTS attempts"
              cat /tmp/update-traffic.err
              exit 1
            fi
            # Any other failure — surface and exit
            echo "❌ Traffic promotion failed with non-conflict error"
            cat /tmp/update-traffic.err
            exit 1
          done

          echo "   Tagged candidate URL remains accessible for verification:"
          echo "   ${{ steps.revision.outputs.candidate_url }}"

      # PR-STARTUP-HARDEN-1 / Infra-Council C3 — post-deploy health verification.
      # The smoke-test gate catches module-load throws BEFORE deploy, but cannot
      # catch issues that surface only with real Cloud Run env + service-account
      # IAM (e.g. malformed FIREBASE_SERVICE_ACCOUNT_KEY value, real DATABASE_URL
      # unreachable, ADC role missing). Poll /api/health on the live URL until
      # startupPhase="ready" or timeout — fail the deploy if not ready in time.
      - name: Verify revision health on live URL (post-deploy)
        env:
          # Public health endpoint, served by the just-promoted revision.
          # Uses petwash.co.il custom domain (the production-facing URL) since
          # that is what real users will hit. If the custom domain points at a
          # stale revision after promotion, this catches it.
          HEALTH_URL: https://petwash.co.il/api/health
          MAX_WAIT_SECONDS: '180'
          POLL_INTERVAL_SECONDS: '5'
          EXPECTED_REVISION: ${{ steps.revision.outputs.revision_name }}
        run: |
          set +e
          deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))
          last_phase=""
          last_revision=""
          while [ $(date +%s) -lt $deadline ]; do
            body=$(curl -s --max-time 10 "$HEALTH_URL" || echo '{}')
            phase=$(printf '%s' "$body" | jq -r '.startupPhase // empty' 2>/dev/null)
            revision=$(printf '%s' "$body" | jq -r '.revision // empty' 2>/dev/null)
            routes_ready=$(printf '%s' "$body" | jq -r '.routesReady // empty' 2>/dev/null)
            server_ready=$(printf '%s' "$body" | jq -r '.serverReady // empty' 2>/dev/null)
            last_phase="$phase"
            last_revision="$revision"
            if [ "$revision" = "$EXPECTED_REVISION" ] \
               && [ "$phase" = "ready" ] \
               && [ "$routes_ready" = "true" ] \
               && [ "$server_ready" = "true" ]; then
              echo "✅ Health check passed — revision $revision is serving ready"
              echo "$body" | jq .
              exit 0
            fi
            echo "   waiting … revision=$revision phase=$phase routes=$routes_ready server=$server_ready"
            sleep "$POLL_INTERVAL_SECONDS"
          done
          echo "❌ Revision did not reach ready state within ${MAX_WAIT_SECONDS}s"
          echo "   Last observed revision:  $last_revision"
          echo "   Last observed phase:     $last_phase"
          echo "   Expected revision:       $EXPECTED_REVISION"
          echo ""
          echo "   Last health body:"
          curl -s --max-time 10 "$HEALTH_URL" | jq . || echo "(curl failed)"
          exit 1

      # Issue #143 — failure path: dump diagnostics from inside GitHub Actions
      # so operators don't need to switch to the GCP console to triage. CRITICAL:
      # this query intentionally does NOT filter by severity=ERROR. Cloud Run
      # startup failures (probe timeouts, ENOENT secrets, bind errors, container
      # crashes) frequently log at DEFAULT/INFO/WARNING and would be hidden by
      # the default Logs Explorer ERROR filter.
      - name: Diagnose failed revision (logs at ALL severities)
        if: failure()
        run: |
          set +e
          SVC="${{ env.SERVICE_NAME }}"
          REGION="${{ env.REGION }}"
          PROJECT="${{ env.PROJECT_ID }}"
          REV_NAME="${{ steps.revision.outputs.revision_name }}"
          TAG="${{ steps.revision.outputs.tag }}"
          CAND_URL="${{ steps.revision.outputs.candidate_url }}"

          if [ -z "$REV_NAME" ]; then
            REV_NAME=$(gcloud run services describe "$SVC" \
              --region "$REGION" --project "$PROJECT" \
              --format='value(status.latestCreatedRevisionName)' 2>/dev/null || echo "")
          fi

          echo "════════════════════════════════════════════════════════════════"
          echo " 🩺 FAILED REVISION DIAGNOSTICS — Issue #143 path"
          echo "════════════════════════════════════════════════════════════════"
          echo "  service:   $SVC"
          echo "  region:    $REGION"
          echo "  revision:  $REV_NAME"
          echo "  tag:       $TAG"
          echo "  candidate: $CAND_URL"
          echo "  ✅ production traffic UNCHANGED — previous revision still serves 100%"
          echo ""

          if [ -z "$REV_NAME" ]; then
            echo "⚠️  Could not resolve revision name — emitting service-level logs only."
          fi

          echo "── Revision describe (status, conditions, container spec) ──────"
          if [ -n "$REV_NAME" ]; then
            gcloud run revisions describe "$REV_NAME" \
              --region "$REGION" --project "$PROJECT" \
              --format='yaml(metadata.name,status.conditions,status.observedGeneration,spec.containers[0].image,spec.containers[0].startupProbe,spec.containers[0].resources)' \
              2>&1 || true
          fi

          echo ""
          echo "── Last 200 application log lines (ALL severities — DEFAULT/DEBUG/INFO/NOTICE/WARNING/ERROR/CRITICAL/ALERT/EMERGENCY) ──"
          if [ -n "$REV_NAME" ]; then
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SVC\" AND resource.labels.revision_name=\"$REV_NAME\"" \
              --project "$PROJECT" --limit=200 --order=desc --freshness=1h \
              --format='table(timestamp,severity,textPayload,jsonPayload.message,jsonPayload.error)' \
              2>&1 || echo "(log read failed — check IAM: roles/logging.viewer)"
          fi

          echo ""
          echo "── Cloud Run system event logs (container start/stop, probe failures) ──"
          if [ -n "$REV_NAME" ]; then
            gcloud logging read \
              "logName=\"projects/$PROJECT/logs/run.googleapis.com%2Fstderr\" AND resource.labels.revision_name=\"$REV_NAME\"" \
              --project "$PROJECT" --limit=100 --order=desc --freshness=1h \
              --format='value(timestamp,textPayload)' \
              2>&1 || true
            echo "----"
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.revision_name=\"$REV_NAME\" AND (logName:\"system\" OR logName:\"requests\" OR protoPayload.@type:\"AuditLog\")" \
              --project "$PROJECT" --limit=50 --order=desc --freshness=1h \
              --format='value(timestamp,severity,textPayload,jsonPayload.message,protoPayload.methodName,protoPayload.status.message)' \
              2>&1 || true
          fi

          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo " 📋 OPERATOR INSTRUCTIONS — Logs Explorer (do NOT filter severity=ERROR)"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "Many Cloud Run startup failures log at INFO or WARNING. Filtering"
          echo "Logs Explorer by severity=ERROR will hide them. Use this query:"
          echo ""
          echo "  resource.type=\"cloud_run_revision\""
          echo "  resource.labels.service_name=\"$SVC\""
          echo "  resource.labels.revision_name=\"$REV_NAME\""
          echo ""
          echo "Direct console link (already encoded):"
          QUERY="resource.type%3D%22cloud_run_revision%22%0Aresource.labels.service_name%3D%22${SVC}%22%0Aresource.labels.revision_name%3D%22${REV_NAME}%22"
          echo "  https://console.cloud.google.com/logs/query;query=${QUERY};duration=PT1H?project=${PROJECT}"
          echo ""
          echo "To see system-level events (container starts, probe results):"
          echo "  resource.type=\"cloud_run_revision\""
          echo "  resource.labels.revision_name=\"$REV_NAME\""
          echo "  logName=\"projects/${PROJECT}/logs/run.googleapis.com%2Fstderr\""
          echo ""
          echo "To re-pull these same logs locally:"
          echo "  gcloud logging read \\"
          echo "    'resource.type=\"cloud_run_revision\" AND resource.labels.revision_name=\"$REV_NAME\"' \\"
          echo "    --project=$PROJECT --limit=200 --order=desc --freshness=1h"
          echo ""
          echo "🔁 Rollback: nothing to do. The failed revision never received"
          echo "    traffic. The previous revision is still live. To delete the"
          echo "    failed candidate (optional cleanup):"
          echo ""
          echo "    gcloud run revisions delete $REV_NAME \\"
          echo "      --region=$REGION --project=$PROJECT --quiet"
          echo ""

  deploy-frontend:
    name: Build & Deploy Frontend (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          # All values are read from GitHub Secrets. VITE_FIREBASE_API_KEY, VITE_FIREBASE_VAPID_KEY,
          # and VITE_GOOGLE_CLIENT_ID must be set as repository secrets — the build will fail without them.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:main --project signinpetwash --non-interactive

      - name: Smoke test — live site check
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://petwash.co.il/" || echo "000")
          API=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://petwash.co.il/api/health" || echo "000")
          echo "Frontend: HTTP $STATUS | API via Firebase: HTTP $API"
          if [ "$STATUS" = "200" ] && [ "$API" = "200" ]; then
            echo "✅ Full stack live check passed"
          else
            echo "❌ Live check FAILED — frontend: $STATUS, API: $API"
            exit 1
          fi
