name: PetWash CI 2025 - Deploy to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: deploy-backend  # Wait for backend to be deployed first

    # All build time env from GitHub Secrets
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}
      VITE_API_URL: https://petwash-api-signinpetwash.me-west1.run.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Optional - if you have a preflight script, otherwise remove this step
      - name: Run preflight checks
        run: |
          if npm run | grep -q "preflight"; then
            npm run preflight
          else
            echo "No preflight script, skipping"
          fi

      - name: Clean dist folder
        run: rm -rf dist/

      - name: Build production bundle
        run: npm run build
        
      - name: Verify build output
        run: |
          echo "=== Build output verification ==="
          ls -la dist/public/
          echo "=== CSS files ==="
          find dist/public -name "*.css" -exec echo {} \; -exec head -20 {} \;
          echo "=== Build timestamp: $(date) ==="

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Google Cloud authentication
        run: |
          echo "=== Verifying authentication ==="
          if [ -z "${{ steps.auth.outputs.credentials_file_path }}" ]; then
            echo "❌ ERROR: No credentials file path from auth step"
            echo "Make sure GOOGLE_APPLICATION_CREDENTIALS_JSON secret contains raw JSON (not base64)"
            exit 1
          fi
          echo "✅ Credentials file: ${{ steps.auth.outputs.credentials_file_path }}"
          
          # Hard fail if cannot access project
          echo "=== Testing project access ==="
          ACCOUNT=$(gcloud config list account --format="value(core.account)")
          if [ -z "$ACCOUNT" ]; then
            echo "❌ ERROR: No gcloud account configured"
            exit 1
          fi
          echo "✅ Authenticated as: $ACCOUNT"
          
          if ! gcloud projects describe signinpetwash --format="value(projectId)" > /dev/null 2>&1; then
            echo "❌ ERROR: Cannot access project 'signinpetwash'"
            echo "Service account needs: Firebase Admin, Firebase Hosting Admin roles"
            exit 1
          fi
          echo "✅ Project access verified"

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          echo "=== Deploying to Firebase Hosting ==="
          echo "Project: signinpetwash"
          echo "Using ADC via GOOGLE_APPLICATION_CREDENTIALS"
          
          # Retry logic for transient network issues
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if firebase deploy --only hosting:main --project signinpetwash --non-interactive; then
              echo "✅ Firebase Hosting deployment complete"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Deploy attempt $RETRY_COUNT failed, retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          
          echo "❌ Firebase Hosting deployment failed after $MAX_RETRIES attempts"
          echo ""
          echo "Common fixes:"
          echo "1. Ensure service account has 'Firebase Hosting Admin' role"
          echo "2. Go to: https://console.firebase.google.com/project/signinpetwash/settings/serviceaccounts"
          echo "3. Or add role via: gcloud projects add-iam-policy-binding signinpetwash --member='serviceAccount:YOUR_SA_EMAIL' --role='roles/firebasehosting.admin'"
          exit 1

      - name: Configure Cloud Storage CORS
        run: |
          echo "=== Configuring Cloud Storage CORS for documents and images ==="
          gsutil cors set cors.json gs://signinpetwash.firebasestorage.app || echo "⚠️ Firebase Storage CORS may need manual config"
          gsutil cors set cors.json gs://petwash-secure-documents || echo "⚠️ Documents bucket CORS may need manual config"
          echo "✅ Storage CORS configuration complete"

  # Deploy backend to Cloud Run FIRST (frontend depends on it)
  deploy-backend:
    runs-on: ubuntu-latest
    
    # Backend build-time environment variables
    env:
      NODE_ENV: production
    
    steps:
      - name: Verify all required GitHub secrets exist
        run: |
          echo "=== Checking GitHub Secrets ==="
          MISSING=0
          
          check_secret() {
            if [ -z "$1" ]; then
              echo "❌ MISSING: $2"
              MISSING=$((MISSING + 1))
            else
              echo "✅ OK: $2"
            fi
          }
          
          check_secret "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" "GOOGLE_APPLICATION_CREDENTIALS_JSON"
          check_secret "${{ secrets.VITE_FIREBASE_API_KEY }}" "VITE_FIREBASE_API_KEY"
          check_secret "${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" "VITE_FIREBASE_AUTH_DOMAIN"
          check_secret "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" "VITE_FIREBASE_PROJECT_ID"
          check_secret "${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" "VITE_FIREBASE_STORAGE_BUCKET"
          check_secret "${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" "VITE_FIREBASE_MESSAGING_SENDER_ID"
          check_secret "${{ secrets.VITE_FIREBASE_APP_ID }}" "VITE_FIREBASE_APP_ID"
          check_secret "${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" "VITE_FIREBASE_MEASUREMENT_ID"
          check_secret "${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" "VITE_RECAPTCHA_SITE_KEY"
          check_secret "${{ secrets.VITE_WEBAUTHN_RP_ID }}" "VITE_WEBAUTHN_RP_ID"
          
          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "❌ $MISSING secret(s) missing! Add them at:"
            echo "   github.com/petwashglobal/petwash-marketplace/settings/secrets/actions"
            exit 1
          fi
          echo ""
          echo "✅ All GitHub secrets verified!"
          echo "ℹ️ Backend secrets (DATABASE_URL, JWT_SECRET, etc.) are pulled from Google Cloud Secret Manager"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker me-west1-docker.pkg.dev

      - name: Create Artifact Registry repository if not exists
        run: |
          if ! gcloud artifacts repositories describe petwash-api --location=me-west1 --format="value(name)" 2>/dev/null; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create petwash-api \
              --repository-format=docker \
              --location=me-west1 \
              --description="PetWash API Docker images"
            echo "✅ Repository created"
          else
            echo "✅ Repository already exists"
          fi

      - name: Verify npm lock file
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found. Run 'npm install' locally and commit the lockfile."
            exit 1
          fi
          echo "✅ package-lock.json found"

      - name: Build Docker image
        timeout-minutes: 30
        run: |
          echo "=== Building Docker image ==="
          echo "Git SHA: ${{ github.sha }}"
          echo "Build started at: $(date)"
          docker build \
            --build-arg NODE_ENV=production \
            --progress=plain \
            -t me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:${{ github.sha }} \
            -t me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:latest \
            . 2>&1
          echo "=== Build complete at: $(date) ==="

      - name: Push Docker image
        run: |
          echo "=== Pushing Docker image ==="
          docker push me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:${{ github.sha }}
          docker push me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:latest
          echo "=== Push complete ==="

      - name: Auto-create missing Google Cloud secrets from GitHub secrets
        run: |
          echo "=== Syncing secrets from GitHub to Google Cloud Secret Manager ==="
          
          sync_secret() {
            SECRET_NAME=$1
            SECRET_VALUE=$2
            
            if [ -z "$SECRET_VALUE" ]; then
              echo "⚠️ SKIP: $SECRET_NAME (not set in GitHub)"
              return
            fi
            
            if gcloud secrets describe $SECRET_NAME --project=signinpetwash > /dev/null 2>&1; then
              echo "✅ EXISTS: $SECRET_NAME"
            else
              echo -n "$SECRET_VALUE" | gcloud secrets create $SECRET_NAME --data-file=- --project=signinpetwash
              echo "🆕 CREATED: $SECRET_NAME"
            fi
            
            PROJECT_NUMBER=$(gcloud projects describe signinpetwash --format='value(projectNumber)')
            gcloud secrets add-iam-policy-binding $SECRET_NAME \
              --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
              --role="roles/secretmanager.secretAccessor" \
              --project=signinpetwash --quiet 2>/dev/null || true
          }
          
          sync_secret "DATABASE_URL" "${{ secrets.DATABASE_URL }}"
          sync_secret "JWT_SECRET" "${{ secrets.JWT_SECRET }}"
          sync_secret "COOKIE_SECRET" "${{ secrets.COOKIE_SECRET }}"
          sync_secret "GOOGLE_API_KEY" "${{ secrets.GOOGLE_API_KEY }}"
          sync_secret "SENDGRID_API_KEY" "${{ secrets.SENDGRID_API_KEY }}"
          sync_secret "FIREBASE_SERVICE_ACCOUNT_KEY" "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}"
          sync_secret "TWILIO_ACCOUNT_SID" "${{ secrets.TWILIO_ACCOUNT_SID }}"
          sync_secret "TWILIO_AUTH_TOKEN" "${{ secrets.TWILIO_AUTH_TOKEN }}"
          sync_secret "TWILIO_PHONE_NUMBER" "${{ secrets.TWILIO_PHONE_NUMBER }}"
          
          echo ""
          echo "✅ All secrets synced to Google Cloud Secret Manager!"

      - name: Deploy to Cloud Run (using Google Cloud Secret Manager)
        run: |
          echo "=== Deploying to Cloud Run ==="
          
          gcloud run deploy petwash-api \
            --image=me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:${{ github.sha }} \
            --region=me-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=1 \
            --max-instances=10 \
            --concurrency=80 \
            --timeout=300 \
            --cpu-boost \
            --execution-environment=gen2 \
            --set-env-vars="NODE_ENV=production" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,COOKIE_SECRET=COOKIE_SECRET:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest"
          
          echo "✅ Cloud Run deployment complete"

      - name: Verify deployment
        run: |
          echo "=== Verifying Cloud Run deployment ==="
          gcloud run services describe petwash-api --region me-west1 --format="value(status.url)"
          echo "=== Deployment verification complete ==="
