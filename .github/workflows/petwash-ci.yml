      # PR-STARTUP-FIX-5: removed "Sync FIREBASE_SERVICE_ACCOUNT_KEY from GitHub secret"
      # step. The CEO's A2 fix (2026-05-18) was to remove the env var and rely on
      # Cloud Run Application Default Credentials. The workflow was silently
      # re-injecting a (possibly malformed) value on every deploy, causing
      # bug #9 (production loading_routes Error on every revision).
      # Firebase admin SDK uses ADC via the Cloud Run service account.
      # If you ever need to pin an explicit service account JSON again,
      # restore this step from git history at commit 723cca8 — but ensure
