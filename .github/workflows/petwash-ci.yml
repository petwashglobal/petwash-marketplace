name: PetWash CI 2025 - Deploy to Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # All build time env from GitHub Secrets
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
      VITE_WEBAUTHN_RP_ID: ${{ secrets.VITE_WEBAUTHN_RP_ID }}
      VITE_API_URL: https://petwash-api-signinpetwash.me-west1.run.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Optional - if you have a preflight script, otherwise remove this step
      - name: Run preflight checks
        run: |
          if npm run | grep -q "preflight"; then
            npm run preflight
          else
            echo "No preflight script, skipping"
          fi

      - name: Clean dist folder
        run: rm -rf dist/

      - name: Build production bundle
        run: npm run build
        
      - name: Verify build output
        run: |
          echo "=== Build output verification ==="
          ls -la dist/public/
          echo "=== CSS files ==="
          find dist/public -name "*.css" -exec echo {} \; -exec head -20 {} \;
          echo "=== Build timestamp: $(date) ==="

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Full JSON of the service account key from Secrets
          # Example service account:
          # petwash-backup-service@signinpetwash.iam.gserviceaccount.com
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          projectId: signinpetwash
          channelId: live

  # Deploy backend to Cloud Run
  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy  # Run after frontend deployment
    
    # Backend build-time environment variables
    env:
      NODE_ENV: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker me-west1-docker.pkg.dev

      - name: Verify npm lock file
        run: |
          if [ ! -f package-lock.json ]; then
            echo "ERROR: package-lock.json not found. Run 'npm install' locally and commit the lockfile."
            exit 1
          fi
          echo "✅ package-lock.json found"

      - name: Build Docker image
        run: |
          echo "=== Building Docker image ==="
          docker build \
            --build-arg NODE_ENV=production \
            --progress=plain \
            -t me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:${{ github.sha }} \
            -t me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:latest \
            .
          echo "=== Build complete ==="

      - name: Push Docker image
        run: |
          echo "=== Pushing Docker image ==="
          docker push me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:${{ github.sha }}
          docker push me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:latest
          echo "=== Push complete ==="

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy petwash-api \
            --image me-west1-docker.pkg.dev/signinpetwash/petwash-api/backend:${{ github.sha }} \
            --platform managed \
            --region me-west1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,COOKIE_SECRET=COOKIE_SECRET:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_KEY=FIREBASE_SERVICE_ACCOUNT_KEY:latest"

      - name: Verify deployment
        run: |
          echo "=== Verifying Cloud Run deployment ==="
          gcloud run services describe petwash-api --region me-west1 --format="value(status.url)"
          echo "=== Deployment verification complete ==="
