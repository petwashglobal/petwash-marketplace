name: Diagnose Firebase auth providers (one-shot)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: signinpetwash
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash
      - name: Dump Google/Apple provider config
        run: |
          set -uo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BASE="https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}"
          echo "== defaultSupportedIdpConfigs (enabled providers) =="
          curl -fsS -H "Authorization: Bearer $TOKEN" "$BASE/defaultSupportedIdpConfigs" | jq '.'
          echo "== google.com config (enabled? clientId present?) =="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/defaultSupportedIdpConfigs/google.com" | jq '{name, enabled, clientId, hasSecret: (.clientSecret!=null and .clientSecret!="")}'
          echo "== apple.com config =="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/defaultSupportedIdpConfigs/apple.com" | jq '{name, enabled, clientId, appleSignInConfig, hasCodeFlow: (.appleSignInConfig!=null)}'
