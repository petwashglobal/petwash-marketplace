name: Diagnose marketplace supply (read-only counts)
on:
  workflow_dispatch:
permissions:
  contents: read
# WHY: the live provider search returns zero walkers and zero sitters for every
# city. This counts rows per gate (signed up / verified / available / priced) so
# we fix the real blocker instead of guessing. READ-ONLY, COUNTS ONLY — no
# names, emails or phone numbers are selected or printed.
jobs:
  supply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: signinpetwash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash
      - name: Fetch DATABASE_URL from Secret Manager
        run: |
          set -e
          DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL --project="$PROJECT_ID")
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Count supply
        run: |
          npm ci --omit=dev --ignore-scripts >/dev/null 2>&1 || npm i @neondatabase/serverless >/dev/null 2>&1
          node scripts/ci/marketplace_supply_counts.mjs
