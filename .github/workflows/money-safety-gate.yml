# Money & Auth Safety Gate — runs on EVERY pull request into main (pre-merge) so
# GitHub branch protection can require these checks before a merge is allowed.
# CEO CTO directive 2026-07-31 (P0-1): "No PR can merge if money tests fail."
#
# This is the PR-time gate. The Production Deploy workflow ALSO runs the money
# suite post-merge (gate-money-tests, in deploy-backend `needs`) as a second net.
#
# Node 24 — matches the committed package-lock.json (generated by npm 11 / Node 24)
# and the existing deploy gates, so `npm ci` is reproducible. Node 22's older npm ci
# rejects this lock as out-of-sync. NOTE (stack-cleanup follow-up): prod Docker is
# node:22-slim, so dev/lock/CI (24) and prod (22) are NOT aligned yet — pick ONE
# version across Docker + CI + .nvmrc and regenerate the lock on it.
name: Money & Auth Safety Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Brand + reachability guards, at PR time ────────────────────────────────
  # CEO 2026-09-12: these two ran ONLY in the Production Deploy workflow, which
  # triggers on `push: [main]` — i.e. AFTER a merge. A PR that put a ™ on the
  # wrong side of a Hebrew word, or shipped a screen nothing links to, went green
  # and only broke the build once it was already on main. The ™ rule is a
  # standing CEO instruction ("in every language, ™ to the RIGHT of the word,
  # never the left"), so it has to block the merge, not report after it.
  #
  # Both are Python/stdlib on purpose — no `npm ci`, so they finish in seconds
  # and cannot be blocked by a dependency problem.
  brand-and-reachability-guards:
    name: brand-and-reachability-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trademark is anchored to the word on its left (every language)
        run: python3 scripts/guards/trademark_bidi_anchored.py --fail
      - name: No new unreachable route
        run: python3 scripts/guards/no_new_unreachable_route.py

  # ── Every pin runs ─────────────────────────────────────────────────────────
  # 2026-09-13: server/tests held 782 test files and the gates named ~115 of
  # them; the other ~670 (incl. ~50 regression pins from the week of 09-12)
  # ran once on a laptop and never again. This job runs the WHOLE vitest
  # suite and fails only on a test FILE that is red and not in the frozen
  # baseline (scripts/ci/pins_red_baseline.txt). Baseline entries that heal
  # are reported for removal. See scripts/ci/pins_with_baseline.mjs.
  regression-pins:
    name: regression-pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Whole suite vs frozen red baseline
        env: { NODE_ENV: test, NAYAX_ENABLED: 'false', SUMIT_ENABLED: 'false', PAYMENT_PROVIDER_MODE: mock }
        run: node scripts/ci/pins_with_baseline.mjs

  money-tests:
    name: money-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Money / VAT / commission / payout / escrow invariants
        env: { NODE_ENV: test, NAYAX_ENABLED: 'false', SUMIT_ENABLED: 'false', PAYMENT_PROVIDER_MODE: mock }
        run: npm run test:money

  auth-identity-tests:
    name: auth-identity-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # This workflow has been called the "Money & AUTH Safety Gate" since it was
      # created, and until now it gated no auth test at all. Every suite below
      # existed and ran only when someone happened to run it by hand — which is
      # how six of them rotted into asserting things that were no longer true,
      # including two that had inverted into rewarding the re-introduction of a
      # fixed enumeration vulnerability. Guards nobody runs are not guards.
      - name: Auth / identity / one-shot-proof invariants
        env: { NODE_ENV: test, NAYAX_ENABLED: 'false', SUMIT_ENABLED: 'false', PAYMENT_PROVIDER_MODE: mock }
        run: >
          npx vitest run
          server/tests/validateTokensSubjectBinding.behavior.test.ts
          server/tests/proofSingleUse.regression.test.ts
          server/tests/emailVerifiedToken.regression.test.ts
          server/tests/otpPersistVerified.regression.test.ts
          server/tests/authPhoneOtpContract.regression.test.ts
          server/tests/authSessionOrphanRollbackAll.regression.test.ts
          server/tests/authCookieLoggingLeaks.regression.test.ts
          server/tests/otpAndCodeLoggingLeaks.regression.test.ts
          server/tests/publicAuthRateLimitWiring.regression.test.ts
          server/tests/verifiedEmailOwnershipSweep.regression.test.ts
          server/tests/loginOrLinkFeederCoverage.regression.test.ts
          server/tests/emailChangeIdentity.behavior.test.ts
          server/tests/identity-login-enumeration.test.ts
          server/tests/legacyOtpPurposeMap.behavior.test.ts
          server/tests/phoneHmac.behavior.test.ts
          server/tests/perUidSmsBudgetWiring.regression.test.ts

  wallet-ledger-tests:
    name: wallet-ledger-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Wallet + eGift + ledger integrity
        env: { NODE_ENV: test, NAYAX_ENABLED: 'false', SUMIT_ENABLED: 'false', PAYMENT_PROVIDER_MODE: mock }
        run: >
          npx vitest run
          server/tests/wallet-e2e-money-flow.test.ts
          server/tests/walletTopupVerify.regression.test.ts
          server/tests/diagnose-wallet-config.test.ts
          server/tests/walletPassAutoProvision.regression.test.ts
          server/tests/credit-wallet-confirm-idor.test.ts
          server/tests/purchaseActivation.test.ts

  booking-payment-tests:
    name: booking-payment-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Booking payment + escrow + double-payout guards
        env: { NODE_ENV: test, NAYAX_ENABLED: 'false', SUMIT_ENABLED: 'false', PAYMENT_PROVIDER_MODE: mock }
        run: >
          npx vitest run
          server/tests/booking-money-guard.test.ts
          server/tests/escrow-fail-closed.test.ts
          server/tests/escrow-idempotency.test.ts
          server/tests/escrowSettlement.test.ts
          server/tests/escrowBookingReceipt.regression.test.ts
          server/tests/walkEscrowFailClosed.regression.test.ts
          server/tests/bookingDoubleBookGuard.regression.test.ts
          server/tests/double-payout-unique-guards.test.ts
          server/tests/payoutAtomicClaim.regression.test.ts
          server/tests/cron-double-payout-lock-2026-07-08.test.ts
          server/tests/cron-money-safety-2026-07-08.test.ts
          server/tests/insurance-payout-gate.test.ts
          server/tests/admin-escrow-guard.test.ts
          server/tests/v2-complete-and-escrow-gate.test.ts
          server/tests/sitterFeeSingle15.test.ts

  sumit-tax-doc-tests:
    name: sumit-tax-doc-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # THE WHOLE FISCAL SURFACE, BY PATTERN — NOT BY HAND (2026-09-12).
      #
      # This step used to name seven files. There were 63 fiscal test files, so
      # 55 of them — every guard on the rail that issues Israeli tax documents —
      # had never run in CI even once. Two had rotted into asserting things that
      # are no longer true, and one of those asserted the BUG: it required the
      # old Wald-only bay list, so reverting to it (and silently ceasing to
      # document the two Green Park bays) would have turned the pin GREEN.
      #
      # Enumerating files is what caused that, so the enumeration is gone. The
      # three filters below are substring matches on the test path, which means a
      # new fiscal test is gated the day it is written, with nothing to remember.
      # Do not replace this with a file list again.
      - name: Fiscal rail — every nayax / sumit / fiscal test
        env: { NODE_ENV: test, NAYAX_ENABLED: 'false', SUMIT_ENABLED: 'false', PAYMENT_PROVIDER_MODE: mock }
        run: npx vitest run nayax sumit fiscal
      - name: Credit notes
        env: { NODE_ENV: test, NAYAX_ENABLED: 'false', SUMIT_ENABLED: 'false', PAYMENT_PROVIDER_MODE: mock }
        run: npx vitest run server/tests/refund-credit-note.test.ts
