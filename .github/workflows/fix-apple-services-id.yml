name: Fix Apple Services ID (one-shot)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: signinpetwash
      SERVICES_ID: il.co.petwash.web
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash
      - name: Set apple.com clientId (surgical — updateMask=clientId only)
        run: |
          set -uo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BASE="https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}"

          echo "== BEFORE =="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/defaultSupportedIdpConfigs/apple.com" \
            | jq '{enabled, clientId, hasCodeFlow: (.appleSignInConfig!=null)}'

          echo "== SET clientId = ${SERVICES_ID} (updateMask=clientId ONLY — code flow untouched) =="
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$BASE/defaultSupportedIdpConfigs/apple.com?updateMask=clientId" \
            -d "{\"clientId\":\"${SERVICES_ID}\"}" >/dev/null

          echo "== AFTER (must show clientId set AND hasCodeFlow still true) =="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/defaultSupportedIdpConfigs/apple.com" \
            | jq '{enabled, clientId, hasCodeFlow: (.appleSignInConfig!=null)}'
