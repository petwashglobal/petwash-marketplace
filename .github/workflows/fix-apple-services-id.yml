name: Fix Apple Services ID (one-shot)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: signinpetwash
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash
      - name: Revert wrong Apple clientId + audit all secrets
        run: |
          set -uo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BASE="https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}"

          echo "== BEFORE: current apple.com clientId =="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/defaultSupportedIdpConfigs/apple.com" | jq '{enabled, clientId}'

          echo "== REVERT: clear clientId (undo the wrong APPLE_WALLET_PASS_TYPE_ID value) =="
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$BASE/defaultSupportedIdpConfigs/apple.com?updateMask=clientId" \
            -d '{"clientId":""}' | jq '{enabled, clientId}'

          echo "== ALL secret names (confirm whether ANY Sign-in-with-Apple Services ID exists) =="
          gcloud secrets list --project="$PROJECT_ID" --format='value(name)'

          echo "== AFTER: final apple.com state =="
          curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/defaultSupportedIdpConfigs/apple.com" | jq '{enabled, clientId, hasCodeFlow: (.appleSignInConfig!=null)}'
