name: "Copilot Setup Steps"

# GitHub executes the `copilot-setup-steps` job automatically before the
# Copilot coding agent starts work on any task in this repo.  It runs in a
# normal, unrestricted network environment — BEFORE the agent's egress firewall
# is activated.  Use it to pre-install everything the agent might need so no
# package-manager or registry call is ever blocked at agent runtime.
#
# IMPORTANT: This file must live on the DEFAULT BRANCH (main) to take effect.
# Changes on a feature branch are inert until merged.
#
# The workflow also self-validates: it re-runs whenever this file is changed
# (push/pull_request path filter) and can be triggered manually from the
# Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job name MUST be exactly `copilot-setup-steps` — GitHub identifies
  # and injects these steps by that exact name before the agent starts.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Permissions for the setup job token.
    # pull-requests: write  — required so the Copilot agent's report_progress
    #   mechanism can update the PR description after committing changes.
    # contents: write — required for the agent to push commits to the branch.
    #
    # FIREWALL NOTE: The Copilot agent calls api.individual.githubcopilot.com
    # at runtime to generate PR descriptions.  If that host is not in the repo's
    # Copilot agent firewall allowlist, the PR-description step will fail with
    # "Invalid response from PR description request: {}".
    # Fix: Settings → Copilot → Agent → Firewall config → add
    #   api.individual.githubcopilot.com
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ===== PRE-FIREWALL SETUP — DO ALL NETWORK WORK HERE =====
      # Everything below runs before the Copilot agent's egress firewall is
      # enabled.  Once the agent starts, outbound calls to npm, GitHub raw,
      # etc. are blocked unless explicitly allow-listed.
      # ===========================================================

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Node 20 — matches the engine target in package.json and is the
          # same version used by petwash-ci.yml.  Pin to a major version so
          # the Copilot environment stays consistent with CI.
          node-version: "20"
          # Cache the npm store so repeated agent runs are fast and do not
          # require a fresh registry download each time.
          cache: "npm"

      - name: Install dependencies
        # --legacy-peer-deps is required because several packages in this
        # repo's dependency tree have conflicting peer declarations that npm 7+
        # rejects by default.  All other workflow files in this repo use the
        # same flag; do not remove it.
        #
        # Keep this step simple: install the full workspace so the agent has
        # everything it needs for any task (type-checking, linting, building,
        # running tests).
        #
        # Do NOT add `npx playwright install` here unless a Copilot task truly
        # requires browser tests.  Browser binaries are large (~300 MB) and
        # only slow down every agent run for no benefit when not needed.  If a
        # future task needs Playwright, add a dedicated step then.
        run: npm ci --legacy-peer-deps
