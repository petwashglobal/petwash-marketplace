name: Cache Cleanup

# Stops GitHub Actions cache from filling to the 10GB cap and forcing manual cleanup.
#
# WHY THIS EXISTS (plain English):
#   Some jobs (CodeQL security scan, npm install, Docker build) write a BIG fresh cache
#   on every push to main. The old rule kept ALL of them for 14 days, so with a high
#   deploy rate we ended up hoarding 8+ copies of the same 500MB CodeQL database (~4GB
#   of pure duplicates). When the 10GB cap is hit, GitHub evicts the *useful* npm cache
#   to make room -> builds get slow. This rule kills the duplicates instead.
#
# Retention rule:
#   - KEEP caches for any OPEN PR (ref refs/pull/<n>/merge) so PR builds stay fast.
#   - For main: group caches into "families" (same logical cache rebuilt each commit)
#     and KEEP only the newest KEEP_PER_FAMILY of each family. Older duplicates are
#     deleted EVEN IF recent. Docker layer caches (buildkit) keep more copies because
#     each is a distinct layer, not a duplicate.
#   - Also delete any main cache older than MAX_AGE_DAYS regardless.
#   - DELETE everything else (closed-PR caches, deleted-branch caches).
#
# Tunable from the Actions tab (workflow_dispatch inputs) without editing this file.
# Only deletes caches (not artifacts). Uses repo-scoped GITHUB_TOKEN, no new secrets.

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list caches that would be deleted, but do not delete)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      keep_per_family:
        description: "How many newest copies of each cache family to keep on main"
        required: false
        default: "2"
        type: string
      keep_buildkit:
        description: "How many newest Docker (buildkit) layer caches to keep on main"
        required: false
        default: "24"
        type: string

permissions:
  # actions: write is required to delete caches via DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune stale Actions caches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prune caches according to retention policy
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          KEEP_PER_FAMILY: ${{ github.event.inputs.keep_per_family || '2' }}
          KEEP_BUILDKIT: ${{ github.event.inputs.keep_buildkit || '24' }}
        with:
          script: |
            const dryRun = (process.env.DRY_RUN || 'false').toLowerCase() === 'true';
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const RETENTION_DAYS = 14;
            const KEEP_PER_FAMILY = Math.max(1, parseInt(process.env.KEEP_PER_FAMILY || '2', 10) || 2);
            const KEEP_BUILDKIT   = Math.max(1, parseInt(process.env.KEEP_BUILDKIT   || '24', 10) || 24);
            const now = Date.now();
            const maxAgeMs = RETENTION_DAYS * 24 * 60 * 60 * 1000;

            // Collapse a cache key to its "family": the same logical cache rebuilt each
            // commit. We strip the volatile tail (commit SHA, run id, content hashes) so
            // that e.g. all CodeQL-javascript base databases map to ONE family.
            //   - Docker buildkit blobs are content-addressed (each is a distinct layer),
            //     so they all share one family and get the larger KEEP_BUILDKIT budget.
            function familyOf(key) {
              if (/^buildkit-blob-/i.test(key)) return 'buildkit-blob';
              return (key || '')
                .replace(/-sha256:[0-9a-f]+/gi, '-<h>')   // explicit sha256 digests
                .replace(/-[0-9a-f]{16,}/gi, '-<h>')       // long content hashes / db hashes
                .replace(/-\d{6,}(-\d+)?$/g, '');          // trailing run id (+ optional -N)
            }

            core.info(`Cache cleanup starting. dryRun=${dryRun} keepPerFamily=${KEEP_PER_FAMILY} keepBuildkit=${KEEP_BUILDKIT} maxAgeDays=${RETENTION_DAYS}`);

            // 1) Collect open PR numbers -> set of refs to keep: refs/pull/<n>/merge
            const openPrRefs = new Set();
            const prIter = github.paginate.iterator(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            for await (const { data: prs } of prIter) {
              for (const pr of prs) {
                openPrRefs.add(`refs/pull/${pr.number}/merge`);
              }
            }
            core.info(`Open PR refs to preserve: ${openPrRefs.size}`);

            // 2) List all caches
            const caches = [];
            const cacheIter = github.paginate.iterator(github.rest.actions.getActionsCacheList, {
              owner, repo, per_page: 100,
            });
            for await (const { data } of cacheIter) {
              // The paginated cache endpoint returns objects keyed differently across versions.
              // Octokit returns the array of caches directly when paginating this route.
              const arr = Array.isArray(data) ? data : (data.actions_caches || []);
              for (const c of arr) caches.push(c);
            }
            core.info(`Total caches found: ${caches.length}`);

            let kept = 0;
            let deleted = 0;
            let bytesFreed = 0;
            const deletions = [];
            const keeps = [];

            // Pre-compute, per main family, the newest-N cache ids to keep.
            // (Open-PR caches and non-main caches are decided directly in the loop.)
            const mainByFamily = new Map();
            for (const c of caches) {
              if ((c.ref || '') !== 'refs/heads/main') continue;
              const fam = familyOf(c.key || '');
              if (!mainByFamily.has(fam)) mainByFamily.set(fam, []);
              mainByFamily.get(fam).push(c);
            }
            const keepIds = new Set();
            for (const [fam, list] of mainByFamily) {
              const budget = fam === 'buildkit-blob' ? KEEP_BUILDKIT : KEEP_PER_FAMILY;
              list.sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
              for (const c of list.slice(0, budget)) keepIds.add(c.id);
            }

            for (const c of caches) {
              const ref = c.ref || '';
              const createdAt = c.created_at ? new Date(c.created_at).getTime() : 0;
              const ageMs = now - createdAt;
              const size = c.size_in_bytes || 0;

              let keep = false;
              let reason = '';

              if (ref === 'refs/heads/main') {
                const fam = familyOf(c.key || '');
                if (ageMs > maxAgeMs) {
                  reason = `main cache older than ${RETENTION_DAYS}d`;
                } else if (keepIds.has(c.id)) {
                  keep = true;
                  reason = `newest of family "${fam}"`;
                } else {
                  reason = `older duplicate of family "${fam}" (beyond newest ${fam === 'buildkit-blob' ? KEEP_BUILDKIT : KEEP_PER_FAMILY})`;
                }
              } else if (openPrRefs.has(ref)) {
                keep = true;
                reason = 'open PR ref';
              } else {
                reason = 'not main and not an open PR';
              }

              if (keep) {
                kept++;
                keeps.push(`KEEP  id=${c.id} ref=${ref} size=${size} key=${c.key} (${reason})`);
              } else {
                deletions.push({ id: c.id, ref, size, key: c.key, reason });
              }
            }

            // 3) Delete the caches
            for (const d of deletions) {
              if (dryRun) {
                core.info(`DRY-RUN would delete id=${d.id} ref=${d.ref} size=${d.size} key=${d.key} (${d.reason})`);
              } else {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner, repo, cache_id: d.id,
                  });
                  deleted++;
                  bytesFreed += d.size;
                  core.info(`DELETED id=${d.id} ref=${d.ref} size=${d.size} key=${d.key} (${d.reason})`);
                } catch (err) {
                  core.warning(`Failed to delete cache id=${d.id} ref=${d.ref}: ${err.message}`);
                }
              }
            }

            // 4) Summary
            const mb = (bytesFreed / (1024 * 1024)).toFixed(2);
            const summary = core.summary
              .addHeading('Cache Cleanup Summary')
              .addRaw(`Mode: ${dryRun ? 'dry-run' : 'live'}`).addBreak()
              .addRaw(`Policy: keep newest ${KEEP_PER_FAMILY}/family (${KEEP_BUILDKIT} for buildkit), max age ${RETENTION_DAYS}d`).addBreak()
              .addRaw(`Main families scanned: ${mainByFamily.size}`).addBreak()
              .addRaw(`Open PR refs preserved: ${openPrRefs.size}`).addBreak()
              .addRaw(`Total caches scanned: ${caches.length}`).addBreak()
              .addRaw(`Kept: ${kept}`).addBreak()
              .addRaw(`Deleted: ${dryRun ? deletions.length + ' (would delete)' : deleted}`).addBreak()
              .addRaw(`Bytes freed: ${bytesFreed} (${mb} MiB)`).addBreak();

            if (deletions.length) {
              summary.addHeading('Deletions', 3).addCodeBlock(
                deletions.map(d => `${dryRun ? 'WOULD DELETE' : 'DELETED'} id=${d.id} ref=${d.ref} size=${d.size} key=${d.key} (${d.reason})`).join('\n'),
                'text'
              );
            }
            if (keeps.length) {
              summary.addHeading('Kept', 3).addCodeBlock(keeps.join('\n'), 'text');
            }
            await summary.write();

            core.info(`SUMMARY kept=${kept} deleted=${dryRun ? 0 : deleted} would_delete=${dryRun ? deletions.length : 0} bytes_freed=${bytesFreed} (${mb} MiB)`);
