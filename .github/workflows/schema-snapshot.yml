name: Schema Snapshot (prod, read-only)

# Produces a STRUCTURE-ONLY dump of the production Neon schema as a downloadable
# artifact. No data, no row values, no secrets — `pg_dump --schema-only`.
#
# WHY: the DB/migration recovery (docs/recovery/2026-07-03-db-migration-recovery/)
# needs the real prod schema to diff against shared/schema.ts (the audit) and to
# author a clean production baseline. The prod DATABASE_URL lives in GCP Secret
# Manager and must never be handled by hand — this job fetches it, masks it, dumps
# schema only, and uploads the result. Nobody touches the connection string.
#
# Manual-only. Read-only. Cannot mutate prod (pg_dump issues no DDL/DML).
#
# Usage: Actions ▸ "Schema Snapshot (prod, read-only)" ▸ Run workflow.
# Then:  gh run download <run-id> -n prod-schema-snapshot

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, Monday 04:00 UTC — keeps the committed DR baseline from going stale.
    # Before this the baseline was a one-time manual capture (2026-07-03) and the
    # only automated output was a 14-day-retention artifact nobody committed.
    - cron: '0 4 * * 1'

concurrency:
  group: schema-snapshot
  cancel-in-progress: true

permissions:
  contents: write        # push the refresh branch
  pull-requests: write   # open/update the baseline-refresh PR (ruleset forbids direct pushes to main)
  id-token: write

jobs:
  snapshot:
    name: Dump prod schema → artifact
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: signinpetwash
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch DATABASE_URL from Secret Manager (masked)
        id: fetch-db-url
        run: |
          set -e
          if ! gcloud secrets describe "DATABASE_URL" --project="$PROJECT_ID" --quiet &>/dev/null; then
            echo "::error::DATABASE_URL secret missing from Secret Manager."
            exit 1
          fi
          DB_URL=$(gcloud secrets versions access latest --secret=DATABASE_URL --project="$PROJECT_ID")
          echo "::add-mask::$DB_URL"
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Dump schema only (pg_dump 18 via docker, version-safe for Neon)
        run: |
          set -e
          # Run pg_dump from the postgres:18 image. pg_dump requires client
          # version >= server; Neon prod is Postgres 18.x (verified 2026-07-03:
          # server 18.4). If Neon later upgrades its major version, bump this tag.
          # --schema-only: structure only, no data. --no-owner/--no-privileges:
          # portable, no role noise. URL passed via env into the container so it
          # never appears in the command line / process list.
          #
          # NOTE: pg_dump needs a SESSION-mode connection. If DATABASE_URL is the
          # Neon POOLED url (host contains "-pooler"), pg_dump can fail under
          # pgbouncer. In that case set a repo/Secret-Manager direct URL, or strip
          # "-pooler" from the host. We detect + warn below.
          if printf '%s' "$DATABASE_URL" | grep -q -- '-pooler'; then
            echo "::warning::DATABASE_URL looks like the Neon POOLED endpoint; pg_dump may need the direct (non-pooler) host."
          fi
          docker run --rm -e PGURL="$DATABASE_URL" postgres:18 \
            sh -c 'pg_dump --schema-only --no-owner --no-privileges "$PGURL"' \
            > prod-schema-snapshot.sql
          echo "Lines: $(wc -l < prod-schema-snapshot.sql)"
          echo "Tables: $(grep -c '^CREATE TABLE' prod-schema-snapshot.sql || true)"
          echo "Indexes: $(grep -c '^CREATE INDEX\|^CREATE UNIQUE INDEX' prod-schema-snapshot.sql || true)"
          # Safety assertion: schema-only must contain no COPY/INSERT data blocks.
          if grep -qE '^(COPY |INSERT INTO )' prod-schema-snapshot.sql; then
            echo "::error::Dump unexpectedly contains data rows — aborting to avoid leaking data."
            exit 1
          fi

      - name: Upload schema snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-schema-snapshot
          path: prod-schema-snapshot.sql
          retention-days: 14
          if-no-files-found: error

      # ── Durable DR baseline ─────────────────────────────────────────────────
      # Turn the disposable artifact into a committed, versioned restore point.
      # The repo ruleset requires PRs for every change to main (bot pushes are
      # rejected GH013), and a docs-only change never triggers a deploy
      # (petwash-ci paths-ignore: docs/**) — so we open/refresh a PR.
      - name: Checkout repo (for the baseline PR)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Refresh committed baseline + open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASELINE="repo/docs/recovery/prod-schema-latest.sql"
          BRANCH="chore/dr-schema-refresh"

          # Strip the volatile pg_dump header (version/timestamp lines) so the diff
          # reflects real schema changes, not noise that would churn a PR weekly.
          grep -vE '^-- (Dumped (from|by)|Started on|Completed on)' prod-schema-snapshot.sql > "$BASELINE.new"

          mkdir -p "$(dirname "$BASELINE")"
          if [ -f "$BASELINE" ] && diff -q "$BASELINE" "$BASELINE.new" >/dev/null 2>&1; then
            echo "Baseline unchanged — nothing to refresh."
            exit 0
          fi
          mv "$BASELINE.new" "$BASELINE"

          cd repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/recovery/prod-schema-latest.sql
          git commit -m "chore(dr): refresh prod schema baseline [skip ci]"
          git push --force origin "$BRANCH"

          # The refreshed branch is pushed above and is the thing that actually
          # matters — opening the PR is a convenience on top of it.
          #
          # `gh pr create` fails with "GitHub Actions is not permitted to create or
          # approve pull requests" unless that repo/org setting is enabled, and a
          # ruleset forbids pushing straight to main. That combination used to turn
          # this whole job RED every week even though the snapshot itself succeeded
          # — pure noise that trains people to ignore a failing pipeline.
          #
          # So: never fail the run over PR plumbing. Warn loudly with the exact fix
          # instead. The snapshot is captured, the artifact is uploaded, and the
          # branch is refreshed regardless.
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "✅ PR already open — force-push refreshed it."
          elif gh pr create --base main --head "$BRANCH" \
                 --title "chore(dr): refresh prod schema baseline" \
                 --body "Automated weekly refresh of the disaster-recovery schema baseline (\`docs/recovery/prod-schema-latest.sql\`) from a read-only \`pg_dump --schema-only\` of prod. Structure only — no data. Merge to keep the DR restore point current. Docs-only: does not trigger a deploy."; then
            echo "✅ opened baseline-refresh PR."
          else
            echo "::warning title=DR baseline needs a PR::Schema snapshot succeeded and branch '$BRANCH' is refreshed, but this workflow cannot open the PR. Enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests', or open the PR manually from '$BRANCH'. The DR baseline stays stale until that branch is merged."
          fi
