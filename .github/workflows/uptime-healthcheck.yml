name: Uptime Health-Check (petwash.co.il)

# Free, repo-native production monitor. Loads the REAL site in a headless browser
# every 15 min and fails if it white-screens / 500s — catching crashes a plain
# ping can't see (the server returns 200 while the React app is broken). On
# failure GitHub emails the repo admins automatically (no paid vendor). Optional
# Slack ping if ALERTS_SLACK_WEBHOOK secret is set.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}        # run on demand from the Actions tab

# Don't pile up overlapping runs.
concurrency:
  group: uptime-healthcheck
  cancel-in-progress: true

# Least privilege: this job only checks out the repo and pings the live site.
permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        # Install Playwright in an EMPTY directory, never the repo root (2026-09-13).
        # "npm init -y" is a no-op when package.json exists, so the old
        # "npm install --no-save playwright" at the root resolved the WHOLE repo
        # tree — including @capacitor/assets -> sharp 0.32.6, whose native build
        # fails whenever its prebuilt libvips download blips (run 34717591551:
        # "vips/vips8: No such file"). The probe then reported a site outage.
        # Node's resolver walks up to ./node_modules, so a symlink is enough.
        #
        # RETRY THE SETUP (2026-09-17). A probe that cannot install itself is
        # NOT a site outage, but it fails the job and GitHub mails "All jobs
        # have failed" — which reads exactly like one. Run 35168250781 died on
        #   npm error code ECONNRESET
        #   network request to https://registry.npmjs.org/playwright failed
        # and homepage-healthcheck.mjs never ran at all; the site was fine, with
        # green checks either side. Same class as the sharp/libvips blip #2465
        # fixed: the probe's own plumbing pages the CEO.
        #
        # Three attempts with backoff on each network step. A real npm or CDN
        # outage still fails (correctly — the probe genuinely cannot run), but a
        # single blip no longer looks like production is down.
        run: |
          set -euo pipefail
          PW_DIR="$RUNNER_TEMP/pw"
          mkdir -p "$PW_DIR"

          retry() {
            local what="$1"; shift
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::probe setup failed after 3 attempts: $what — this is the PROBE, not the site"
                return 1
              fi
              local wait=$((attempt * 10))
              echo "::warning::$what failed (attempt $attempt/3) — retrying in ${wait}s"
              sleep "$wait"
              attempt=$((attempt + 1))
            done
          }

          (cd "$PW_DIR" && npm init -y >/dev/null)
          retry "npm install playwright" \
            npm --prefix "$PW_DIR" install --no-audit --no-fund playwright@1.58.2
          ln -sfn "$PW_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
          retry "playwright install chromium" \
            npx --prefix "$PW_DIR" playwright install --with-deps chromium

      # Only THIS step's failure means the site is degraded. Any failure above
      # it is the probe's own setup (see the retry note there).
      - name: Run health-check
        id: probe
        run: node scripts/monitoring/homepage-healthcheck.mjs "https://petwash.co.il"

      # Optional: ping Slack on failure (only if the secret is configured).
      # Fires only when the PROBE ran and judged the site degraded — not when
      # the runner could not install a browser.
      - name: Slack alert on failure
        if: failure() && steps.probe.conclusion == 'failure' && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERTS_SLACK_WEBHOOK }}
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 PetWash uptime check FAILED — petwash.co.il is degraded or white-screening. See GitHub Actions run: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"'"}' \
            "$SLACK_WEBHOOK" || true
