# One-shot: ensure petwash.co.il is in Firebase Authentication "Authorized domains".
#
# Google/Apple sign-in on a CUSTOM auth domain (petwash.co.il) only works if that
# domain is in Firebase Auth's authorizedDomains list. If it's missing, the OAuth
# handshake fails and the user is bounced back to the login page — exactly the
# months-long "Gmail returns to login" bug. This can't be fixed in app code.
#
# The deploy service account already runs against this project; if it has the
# Firebase Auth admin permission (firebaseauth.configs.get/update), this job reads
# the current authorized domains and ADDS petwash.co.il + www.petwash.co.il without
# removing anything (idempotent). If the SA lacks the permission it fails with a
# clear error — then grant roles/firebaseauth.admin once and re-run.
name: Fix Firebase auth domains (one-shot)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: signinpetwash
    steps:
      - name: Auth to GCP (same creds as deploy)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash

      - name: Ensure petwash.co.il in Firebase authorized domains
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          BASE="https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/config"

          echo "-- Reading current Firebase Auth config"
          if ! CFG="$(curl -fsS -H "Authorization: Bearer $TOKEN" "$BASE")"; then
            echo "READ FAILED - the deploy service account likely lacks firebaseauth.configs.get."
            echo "Grant it 'Firebase Authentication Admin' (roles/firebaseauth.admin) once, then re-run."
            exit 1
          fi

          echo "-- Current authorizedDomains:"
          echo "$CFG" | jq -r '.authorizedDomains[]?'

          MERGED="$(echo "$CFG" | jq -c '{authorizedDomains: ((.authorizedDomains // []) + ["petwash.co.il","www.petwash.co.il"] | unique)}')"

          echo "-- Patching authorizedDomains to:"
          echo "$MERGED" | jq -r '.authorizedDomains[]'

          if ! RESP="$(curl -fsS -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "${BASE}?updateMask=authorizedDomains" -d "$MERGED")"; then
            echo "PATCH FAILED - the deploy service account likely lacks firebaseauth.configs.update."
            echo "Grant it 'Firebase Authentication Admin' (roles/firebaseauth.admin) once, then re-run."
            exit 1
          fi

          echo "-- Done. authorizedDomains now:"
          echo "$RESP" | jq -r '.authorizedDomains[]'
          echo "Google/Apple sign-in should work on petwash.co.il within a minute."
