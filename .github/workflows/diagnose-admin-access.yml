name: Diagnose admin access (why is the backend locked)
on:
  workflow_dispatch:
    inputs:
      emails:
        description: "Comma-separated candidate login emails to inspect"
        required: false
        default: "nir.h@petwash.co.il,nirhadad1@gmail.com,nir@petwash.co.il,info@petwash.co.il"
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_ID: signinpetwash
      SERVICE: petwash-api
      REGION: me-west1
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: signinpetwash
      - name: What does prod consider a super-admin?
        run: |
          set -uo pipefail
          echo "===== SUPER_ADMIN_EMAILS in the deployed Cloud Run service ====="
          # Plain env value (if set directly)
          PLAIN="$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='json' 2>/dev/null \
            | jq -r '(.spec.template.spec.containers[0].env // [])[] | select(.name=="SUPER_ADMIN_EMAILS") | (.value // ("<secretRef:" + (.valueFrom.secretKeyRef.name // "?") + ">"))' )"
          if [ -z "${PLAIN:-}" ]; then
            echo "SUPER_ADMIN_EMAILS: NOT SET on the service  ==> super-admin email bypass is DISABLED in prod (every admin depends on a role claim)"
          else
            echo "SUPER_ADMIN_EMAILS (env entry): $PLAIN"
            case "$PLAIN" in
              "<secretRef:"*)
                SECRET="$(echo "$PLAIN" | sed -E 's/^<secretRef:(.*)>$/\1/')"
                echo "-- resolving Secret Manager value for '$SECRET' --"
                gcloud secrets versions access latest --secret="$SECRET" 2>/dev/null \
                  | tr ',' '\n' | sed 's/^/   allow: /' || echo "   (could not read secret)"
                ;;
              *) echo "$PLAIN" | tr ',' '\n' | sed 's/^/   allow: /' ;;
            esac
          fi
      - name: Inspect each candidate account (role claim / MFA / disabled)
        run: |
          set -uo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          LOOKUP="https://identitytoolkit.googleapis.com/v1/projects/${PROJECT_ID}/accounts:lookup"
          IFS=',' read -ra EMAILS <<< "${{ github.event.inputs.emails }}"
          for e in "${EMAILS[@]}"; do
            e="$(echo "$e" | xargs)"   # trim
            [ -z "$e" ] && continue
            echo "================================================================"
            echo "ACCOUNT: $e"
            RESP="$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"email\":[\"$e\"]}" "$LOOKUP")"
            EXISTS="$(echo "$RESP" | jq -r '.users | length // 0')"
            if [ "$EXISTS" = "0" ]; then
              echo "  -> NO SUCH USER in Firebase Auth (never logged in with this email?)"
              continue
            fi
            echo "$RESP" | jq -r '.users[0] | {
              localId,
              email,
              emailVerified,
              disabled,
              lastLoginAt,
              providers: [ (.providerUserInfo // [])[].providerId ],
              customClaims: (if .customAttributes then (.customAttributes|fromjson) else {} end),
              mfaEnrolled: ((.mfaInfo // []) | length > 0)
            }'
            ROLE="$(echo "$RESP" | jq -r '.users[0].customAttributes // "{}" | fromjson | .role // "<none>"')"
            echo "  VERDICT: role claim = $ROLE"
            case "$ROLE" in
              super_admin|admin|ceo|management|ops|hr|finance|staff)
                echo "    -> role grants admin access (passes requireRole)";;
              viewer)
                echo "    -> VIEWER: can SEE admin but EVERY save is blocked (READ_ONLY_ACCESS)";;
              *)
                echo "    -> role does NOT grant admin. Access depends ENTIRELY on the email being in SUPER_ADMIN_EMAILS above. If it isn't, this account is fully locked out of /api/admin (can't see OR save).";;
            esac
          done
          echo "================================================================"
          echo "READ: match the account's 'email' against the 'allow:' list up top."
          echo " - email in allow-list  => full super-admin (bypasses role/staff/MFA/read-only)."
          echo " - not in list + role<none>/public => locked out everywhere."
          echo " - not in list + role=viewer => can view, cannot save."
