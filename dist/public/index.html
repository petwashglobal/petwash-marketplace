    <!-- Firebase Runtime Config: fetched in parallel with JS download.
         main.tsx races this against a 400ms timeout — app never stalls waiting for this. -->
    <script>
      window.__FIREBASE_CONFIG_READY__ = (async function initFirebaseConfig() {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 3000);
          const response = await fetch('/api/config/firebase', { signal: controller.signal });
          clearTimeout(timeout);
          if (response.ok) {
            window.__FIREBASE_CONFIG__ = await response.json();
            console.log('[Firebase Runtime Config] ✅ Loaded successfully', {
              hasApiKey: !!window.__FIREBASE_CONFIG__.apiKey,
              projectId: window.__FIREBASE_CONFIG__.projectId,
              authDomain: window.__FIREBASE_CONFIG__.authDomain
            });
          } else {
            console.error('[Firebase Runtime Config] ❌ HTTP', response.status, '- using env var fallback');
            window.__FIREBASE_CONFIG__ = null;
          }
        } catch (error) {
          console.error('[Firebase Runtime Config] ❌ Failed - using env var fallback');
          window.__FIREBASE_CONFIG__ = null;
        }
        return true;
      })();
    </script>
